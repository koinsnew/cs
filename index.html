<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객관리</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#eff1f5;--surface:#fff;--surface-2:#f6f7fa;
    --ink:#171c2c;--ink-2:#444b5d;--muted:#586074;--line:#dfe3ea;--line-2:#c4cad6;
    --brand:#1c3a6e;--brand-deep:#14284f;--brand-tint:#e6ecf5;
    --alert:#b3261e;--alert-bg:#fdeceb;--alert-line:#f0c8c4;
    --caution:#97580a;--caution-bg:#fbf1e0;
    --chip:#e8ebf1;
    --shadow-sm:0 1px 2px rgba(23,28,44,.06);
    --shadow:0 1px 3px rgba(23,28,44,.09);
    --shadow-lg:0 8px 24px rgba(23,28,44,.18);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scrollbar-color:#c1c7d3 transparent;scrollbar-width:thin}
  ::selection{background:rgba(28,58,110,.18);color:inherit}
  input,textarea,select{caret-color:var(--brand)}
  ::placeholder{color:#5f6678;opacity:1}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
  .num{font-variant-numeric:tabular-nums}
  .ico{width:18px;height:18px;flex:0 0 auto;vertical-align:-4px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  html,body{margin:0;padding:0}
  body{font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:76px;display:none}
  .app.on{display:block}
  .mark{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;letter-spacing:-.02em;flex:0 0 36px}

  /* 로그인 */
  .login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;background:var(--brand-deep);overflow-y:auto}
  .login.hide{display:none}
  .login-card{background:#fff;border-radius:20px;width:100%;max-width:384px;padding:32px 24px 24px;box-shadow:var(--shadow-lg)}
  .login .mark{width:56px;height:56px;border-radius:16px;font-size:30px;margin:0 auto 16px}
  .login h1{text-align:center;margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:-.03em}
  .login .desc{text-align:center;color:var(--muted);font-size:15px;margin-bottom:22px;letter-spacing:0}
  .login label{display:block;font-size:14px;color:var(--ink-2);font-weight:700;margin:14px 2px 6px;letter-spacing:0}
  .login input{width:100%;min-height:50px;border:1.5px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit}
  .login input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(28,58,110,.16)}
  .login-btn{width:100%;min-height:52px;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:14px;font-size:17px;font-weight:800;margin-top:22px;cursor:pointer;font-family:inherit}
  .login-btn:active{background:var(--brand-deep)}
  .login-btn:disabled{opacity:.6}
  .login-err{color:var(--alert);font-size:14px;text-align:center;margin-top:12px;min-height:20px;font-weight:700}
  .login-note{color:var(--ink-2);font-size:14px;text-align:center;margin-top:14px;line-height:1.5}

  .appbar{position:sticky;top:0;z-index:40;background:#fff;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .appbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .appbar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .appbar .who{color:var(--muted);font-size:14px;line-height:1.3}
  .appbar .who b{color:var(--brand);font-weight:700}
  .logout{background:#fff;border:1.5px solid var(--line-2);border-radius:10px;min-height:44px;padding:0 14px;font-size:14px;color:var(--ink-2);font-weight:700;cursor:pointer;font-family:inherit}

  .view{display:none;padding:16px 16px}
  .view.active{display:block;animation:fade .22s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .hello{margin:0 2px 10px}
  .hello .h1{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
  .hello .h2{color:var(--muted);font-size:14px;margin-top:2px}

  /* 연체·실효: 한 줄 경고 바 */
  .od-bar{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 12px 10px 16px;border:none;border-radius:14px;background:var(--alert);color:#fff;font-family:inherit;text-align:left;cursor:pointer;margin:0 0 4px}
  .od-bar:active{background:#951f18}
  .od-bar svg{width:24px;height:24px;flex:0 0 24px}
  .od-bar .ob-t{flex:1;min-width:0}
  .od-bar .ob-1{font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
  .od-bar .ob-2{font-size:14px;font-weight:600;margin-top:1px;line-height:1.35}
  .od-bar .ob-1,.od-bar .ob-2{display:block}
  .od-bar .chev{width:22px;height:22px;flex:0 0 22px}
  .od-ok{border-radius:12px;padding:10px 14px;margin:0 0 4px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:15px;border:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .od-ok .ico{color:var(--brand)}
  .od-item{background:#fff;border:1.5px solid var(--alert-line);border-radius:14px;padding:16px 14px 14px;margin-bottom:12px}
  .od-item.lapse{border-color:#e39c96;background:#fffafa}
  .od-item .oi-name{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .od-item .oi-prod{color:var(--ink-2);font-size:15px;margin-top:6px;line-height:1.5}
  .od-item .oi-money{display:flex;gap:10px;margin-top:12px}
  .od-item .oi-box{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .od-item .oi-box .k{font-size:14px;color:var(--muted);font-weight:600}
  .od-item .oi-box .v{font-size:18px;font-weight:800;margin-top:1px;letter-spacing:-.02em}
  .od-item .oi-box.neg .v{color:var(--alert)}
  .od-item .oi-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:10px;font-size:14px}
  .od-item .oi-grid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:7px 0}
  .od-item .oi-grid span:first-child{color:var(--muted);white-space:nowrap}
  .od-item .oi-grid span:last-child{font-weight:700;text-align:right}
  .od-item .oi-none{margin-top:12px;font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;text-align:center}
  .b-lapse{background:var(--alert);color:#fff}.b-late{background:var(--caution);color:#fff}.b-chk{background:var(--chip);color:var(--ink-2)}
  .b-track{background:var(--caution-bg);color:var(--caution)}.b-ok{background:var(--brand-tint);color:var(--brand)}.b-end{background:var(--ink);color:#fff}.b-new{background:var(--alert-bg);color:var(--alert)}
  .od-log{margin-top:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-2);line-height:1.6}
  .od-log b{color:var(--ink)}
  .od-form{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
  .od-form .actions{position:sticky;bottom:0;background:#fff;padding:10px 0 2px;margin-top:12px;border-top:1px solid var(--line)}
  .od-item.lapse .od-form .actions{background:#fffafa}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;min-height:48px;border:1.5px solid var(--line-2);background:#fff;border-radius:10px;font-weight:700;font-size:15px;font-family:inherit;color:var(--ink-2);cursor:pointer}
  .seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
  .od-rec{width:100%;margin-top:12px;min-height:48px;border-radius:10px;border:1.5px solid var(--alert);background:#fff;color:var(--alert);font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .section-title{font-size:16px;font-weight:800;color:var(--ink);margin:12px 2px 2px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .section-title .more{min-height:44px;padding:0 4px 0 12px;background:none;border:none;color:var(--brand);font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:2px}
  .subline{font-size:14px;color:var(--muted);margin:0 2px 10px}

  /* 고객 카드 */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
  .card:active{background:var(--surface-2)}
  .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .name{font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.3}
  .stline{font-size:16px;font-weight:800;margin-top:3px;color:var(--alert);line-height:1.4}
  .stline.idle{color:var(--caution)}.stline.ok{color:var(--muted);font-weight:600}
  .meta{color:var(--ink-2);font-size:14px;margin-top:1px;display:flex;gap:8px;min-width:0}
  .meta .p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta .f{flex:0 0 auto;font-weight:700}
  .badge{display:inline-block;font-size:14px;font-weight:700;padding:0 9px;border-radius:999px;white-space:nowrap;line-height:1.65}
  .b-red{background:var(--alert-bg);color:var(--alert)}.b-amber{background:var(--caution-bg);color:var(--caution)}
  .b-outline{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}.b-gray{background:var(--chip);color:var(--ink-2)}
  .cc{font-size:14px;font-weight:700;padding:0 9px;border-radius:999px;background:var(--chip);color:var(--ink-2);line-height:1.65;white-space:nowrap}
  .addr{margin-top:6px;color:var(--ink-2);font-size:14px;display:flex;gap:6px;align-items:center;min-width:0}
  .addr svg{flex:0 0 14px;opacity:.7}
  .addr span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dist{color:var(--brand);font-weight:700}
  .actions{display:flex;flex-wrap:nowrap;gap:8px;margin-top:12px}
  .act{flex:1 1 0;min-width:0;min-height:48px;white-space:nowrap;border:1.5px solid var(--line-2);background:#fff;color:var(--ink);border-radius:10px;padding:0;font-weight:700;font-size:15px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;text-decoration:none}
  .act:active{background:var(--surface-2)}
  .act.call{flex:1.6 1 0;background:var(--brand);border-color:var(--brand);color:#fff}
  .act.call:active{background:var(--brand-deep)}
  .act:not(.call) svg{display:none}
  .act svg{width:17px;height:17px}
  .touch{width:100%;margin-top:12px;min-height:48px;border-radius:10px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .touch.done{color:var(--brand);background:var(--brand-tint);border-color:transparent}

  .search{width:100%;min-height:48px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;margin-bottom:10px;outline:none;font-family:inherit}
  .search:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(28,58,110,.16)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chip{white-space:nowrap;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink-2);min-height:44px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .sortrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .sortrow label{font-size:14px;color:var(--muted);font-weight:700;flex:0 0 auto}
  .sortrow select{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line-2);background:#fff;border-radius:10px;padding:0 10px;font-size:15px;font-family:inherit;color:var(--ink);font-weight:600}
  .hintline{font-size:14px;color:var(--muted);margin:2px 2px 12px;line-height:1.5}

  .map-wrap{position:relative}
  #map{height:calc(100vh - 250px);min-height:320px;border-radius:14px;border:1px solid var(--line);z-index:1}
  .loc-fab{position:absolute;right:12px;bottom:14px;z-index:5;width:48px;height:48px;border-radius:12px;background:#fff;border:1.5px solid var(--line-2);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .loc-fab svg{width:22px;height:22px;color:var(--brand)}
  .maprow{display:flex;gap:8px;margin-bottom:10px}
  .btn{min-height:48px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;padding:0 15px;font-weight:700;font-size:15px;font-family:inherit;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:7px;justify-content:center}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);flex:1}
  .btn svg{width:17px;height:17px}
  .pinwrap{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  .pin{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;line-height:1}
  .legend{display:flex;gap:10px 16px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--ink-2)}
  .legend span{display:inline-flex;align-items:center}
  .legend i{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:800;color:#fff;margin-right:6px}
  .leaflet-bar a{width:44px!important;height:44px!important;line-height:44px!important;font-size:22px!important}
  .leaflet-control-attribution{font-size:12px!important}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;padding:0 6px env(safe-area-inset-bottom)}
  .nav button{flex:1;background:none;border:none;border-top:3px solid transparent;padding:5px 0 4px;min-height:58px;color:var(--muted);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-family:inherit}
  .nav button.on,.nav button[aria-current="page"]{color:var(--brand);border-top-color:var(--brand)}
  .nav svg{width:22px;height:22px}

  .scrim{position:fixed;inset:0;background:rgba(23,28,44,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .scrim.on{display:flex}
  .sheet{position:relative;background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:0 18px;animation:up .28s var(--ease)}
  .sheet::after{content:"";display:block;height:28px}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet-head{position:sticky;top:0;z-index:3;background:#fff;margin:0 -18px;padding:8px 18px 12px;border-bottom:1px solid var(--line)}
  .grab{width:40px;height:4px;background:#cdd2dc;border-radius:2px;margin:2px auto 10px}
  .sh-row{display:flex;align-items:flex-start;gap:10px}
  .sh-t{flex:1;min-width:0}
  .sh-sub{color:var(--muted);font-size:14px;margin-top:2px}
  .sh-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .sheet-close{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .sheet h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
  .dstat{margin-top:6px;font-size:16px;font-weight:800;color:var(--alert)}
  .dstat.idle{color:var(--caution)}.dstat.ok{color:var(--muted);font-weight:600}
  .sheet-head .actions{margin-top:10px}
  .grp{margin-top:20px}
  .grp-t{font-size:14px;font-weight:800;color:var(--muted);margin:0 0 2px;letter-spacing:0}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
  .kv .k{color:var(--muted);white-space:nowrap;flex:0 0 auto;font-size:15px}.kv .v{font-weight:600;text-align:right;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;min-width:0}
  .memo-box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;font-size:16px;color:var(--ink);line-height:1.65;white-space:pre-wrap}
  .memo-box.none{color:var(--muted);font-size:15px}
  .btn-sec{width:100%;margin-top:14px;min-height:48px;background:#fff;color:var(--brand);border:1.5px solid var(--brand);border-radius:10px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer}

  .contract{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;margin-top:8px}
  .contract .ct{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .contract .cp{font-weight:800;font-size:16px;line-height:1.4}
  .contract .cf{color:var(--ink-2);font-size:14px;margin-top:2px}
  .contract .edit{background:#fff;border:1.5px solid var(--line-2);border-radius:10px;min-height:44px;padding:0 16px;font-size:15px;font-family:inherit;font-weight:700;color:var(--brand);cursor:pointer;white-space:nowrap}
  .add-contract,.add-fam{width:100%;margin-top:10px;min-height:48px;background:#fff;color:var(--brand);border:1.5px dashed var(--line-2);border-radius:10px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .fam-row{display:flex;gap:8px;margin-bottom:8px}
  .fam-row input{min-height:48px;border:1.5px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;outline:none}
  .fam-row input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(28,58,110,.16)}
  .fam-row .fam-rel{flex:0 0 38%}.fam-row .fam-name{flex:1;min-width:0}
  .fam-row .fam-del{flex:0 0 48px;width:48px;border:1.5px solid var(--line-2);background:#fff;border-radius:10px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  details.more{margin-top:22px;border-top:1px solid var(--line);padding-top:4px}
  details.more summary{min-height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:15px;cursor:pointer;list-style:none}
  details.more summary::-webkit-details-marker{display:none}
  .danger-btn{width:100%;min-height:48px;background:var(--alert-bg);color:var(--alert);border:1.5px solid var(--alert-line);border-radius:10px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;margin-top:6px}

  .field{margin-top:14px}
  .field label{display:block;font-size:14px;color:var(--ink-2);font-weight:700;margin-bottom:6px}
  .field .hint{color:var(--muted);font-weight:500;font-size:14px}
  .field input,.field select,.field textarea{width:100%;min-height:48px;border:1.5px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:11px 13px;font-size:16px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(28,58,110,.16)}
  .field textarea{resize:vertical}
  .field .locked{background:var(--chip);color:var(--ink-2);cursor:not-allowed;font-weight:700}
  .field .err{display:block;color:var(--alert);font-size:14px;font-weight:700;margin-top:6px}
  .field.invalid input{border-color:var(--alert)}
  .field .addr-row{display:flex;gap:8px}
  .field .addr-row input{flex:1;cursor:pointer}
  .field .addr-btn{flex:0 0 auto;min-height:48px;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:0 18px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
  .sheet-foot{position:sticky;bottom:0;z-index:3;background:#fff;margin:18px -18px -28px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .save-btn{width:100%;min-height:52px;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:13px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
  .save-btn:active{background:var(--brand-deep)}
  .save-btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line-2)}
  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:16px;line-height:1.6}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
  .empty .btn-sec{width:auto;padding:0 20px;margin-top:12px}
  .toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));text-align:center;line-height:1.45;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:600;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;box-shadow:var(--shadow-lg)}
  .toast.on{opacity:1}
  .loader{position:fixed;inset:0;background:rgba(239,241,245,.84);display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;z-index:70}
  .loader .lt{font-size:15px;font-weight:700;color:var(--ink-2)}
  .loader.on{display:flex}
  .spin{width:36px;height:36px;border:3px solid #d3d8e2;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));z-index:75;width:calc(100% - 24px);max-width:496px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:none;align-items:center;gap:8px;box-shadow:var(--shadow-lg)}
  .cbar.on{display:flex;animation:up .28s var(--ease)}
  .cbar .t{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.4}
  .cbar button{min-height:48px;border:none;border-radius:10px;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer;padding:0 14px}
  .cbar .yes{background:#fff;color:var(--ink)}.cbar .no{background:transparent;color:#d6d9e2}
  .navopt{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .navopt button{min-height:60px;border:1.5px solid var(--line-2);background:#fff;border-radius:12px;text-align:left;padding:10px 14px;font-family:inherit;cursor:pointer;display:flex;gap:10px;align-items:center}
  .navopt button b{display:block;font-size:16px;color:var(--ink)}.navopt button span{display:block;font-size:14px;color:var(--ink-2);word-break:keep-all;overflow-wrap:anywhere}
  /* 확인창 */
  .cscrim{position:fixed;inset:0;background:rgba(23,28,44,.55);z-index:210;display:none;align-items:center;justify-content:center;padding:24px}
  .cscrim.on{display:flex;animation:hlfade .18s ease-out both}
  .cbox{background:#fff;border-radius:16px;width:100%;max-width:340px;padding:24px 20px 18px;text-align:center;box-shadow:var(--shadow-lg);animation:up .26s var(--ease)}
  .cbox .cico{width:52px;height:52px;border-radius:50%;background:var(--alert-bg);color:var(--alert);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .cbox .cico svg{width:26px;height:26px}
  .cbox .ctitle{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;color:var(--ink)}
  .cbox .cmsg{font-size:16px;color:var(--ink-2);line-height:1.6;margin-bottom:18px;word-break:keep-all}
  .cbox .crow{display:flex;gap:8px}
  .cbtn{flex:1;min-height:50px;border-radius:10px;padding:12px 0;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;border:none}
  .cbtn.cancel{background:#fff;color:var(--ink-2);border:1.5px solid var(--line-2)}
  .cbtn.danger{background:var(--alert);color:#fff}
  .cbtn.brand{background:var(--brand);color:#fff}
  .cbtn:active{filter:brightness(.92)}
  /* 접속 화면 */
  .hloader{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--brand-deep);color:#fff}
  .hloader.on{display:flex;animation:hlfade .25s ease-out both}
  .hloader.out{animation:hlout .35s ease-out forwards}
  .hl-mark{width:84px;height:84px;border-radius:24px;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;line-height:1}
  .hl-word{margin-top:22px;font-size:22px;font-weight:800;letter-spacing:.01em}
  .hl-sub{margin-top:8px;font-size:15px;font-weight:600;color:rgba(255,255,255,.8);animation:hlblink 1.6s ease-in-out infinite}
  @keyframes hlfade{from{opacity:0}to{opacity:1}}
  @keyframes hlout{to{opacity:0;visibility:hidden}}
  @keyframes hlblink{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login" id="login">
  <div class="login-card">
    <div class="mark" aria-hidden="true">H</div>
    <h1>고객관리</h1>
    <div class="desc">헤리티지 고객관리 시스템</div>
    <form id="login-form" onsubmit="event.preventDefault();doLogin()">
    <label for="in-name">성명</label>
    <input id="in-name" placeholder="홍길동" autocomplete="name">
    <label for="in-jumin">주민번호 뒷자리</label>
    <input id="in-jumin" placeholder="7자리 숫자" inputmode="numeric" autocomplete="off" data-lpignore="true" data-1p-ignore="true" type="password" maxlength="7">
    <button class="login-btn" id="login-btn" type="submit">로그인</button>
    </form>
    <div class="login-err" id="login-err" role="alert"></div>
    <div class="login-note">주민번호 뒷자리는 본인 확인에만 쓰이고 저장되지 않아요</div>
  </div>
</div>

<!-- 앱 -->
<div class="app" id="app">
  <div class="appbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">H</div>
      <div><h1>고객관리</h1><div class="who"><b id="me-name"></b> <span id="me-role"></span></div></div>
    </div>
    <button class="logout" id="logout-btn" type="button">로그아웃</button>
  </div>

  <section class="view active" id="v-today">
    <div class="hello"><div class="h1" id="hi-name">안녕하세요</div><div class="h2"><span id="hi-date"></span><span id="hi-done"></span><span id="sync" role="status" aria-live="polite"></span></div></div>
    <div id="od-wrap"></div>
    <h2 class="section-title"><span id="today-title">오늘 챙길 고객</span><button type="button" class="more" id="to-list">전체 고객 <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></h2>
    <div id="today-list"></div>
  </section>

  <section class="view" id="v-list">
    <input class="search" id="search" type="search" placeholder="이름·연락처·주소·상품·메모 검색" aria-label="고객 검색">
    <div class="chips" id="chips" role="group" aria-label="상태로 거르기">
      <button type="button" class="chip on" data-f="전체" aria-pressed="true">전체</button>
      <button type="button" class="chip" data-f="상령임박" aria-pressed="false">상령임박</button>
      <button type="button" class="chip" data-f="장기미접촉" aria-pressed="false">장기미접촉</button>
      <button type="button" class="chip" data-f="신규가망" aria-pressed="false">신규가망</button>
      <button type="button" class="chip" data-f="관리중" aria-pressed="false">관리중</button>
    </div>
    <div class="sortrow"><label for="sort">정렬</label>
      <select id="sort">
        <option value="urgent">급한 순</option>
        <option value="idle">연락 오래된 순</option>
        <option value="renew">상령일 가까운 순</option>
        <option value="name">이름순</option>
        <option value="dist" disabled>가까운 순 (지도에서 내 주변 고객)</option>
      </select>
    </div>
    <div class="hintline" id="hint"></div>
    <div id="list"></div>
  </section>

  <section class="view" id="v-map">
    <div class="maprow">
      <button class="btn primary" id="near-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>내 주변 고객</button>
      <button class="btn" id="all-btn" type="button">전체 보기</button>
    </div>
    <div class="map-wrap">
      <div id="map"><div class="empty">지도를 불러오는 중이에요…</div></div>
      <button class="loc-fab" id="loc-btn" type="button" aria-label="내 위치 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
    <div class="legend">
      <span><i style="background:#b3261e">상</i>상령임박</span>
      <span><i style="background:#97580a">장</i>장기미접촉</span>
      <span><i style="background:#1c3a6e">신</i>신규가망</span>
      <span><i style="background:#586074">관</i>관리중</span>
    </div>
  </section>
</div>

<div class="scrim" id="detail-scrim"><div class="sheet" id="detail-sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>

<div class="scrim" id="form-scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="form-title" tabindex="-1">
    <div class="sheet-head"><div class="grab"></div>
      <div class="sh-row"><div class="sh-t"><h2 id="form-title">신규 고객 추가</h2></div>
      <button class="sheet-close" type="button" onclick="closeForm()" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    </div>
    <input type="hidden" id="f-row">
    <div id="grp-person">
      <div class="field"><label for="f-name">이름 *</label><input id="f-name" placeholder="홍길동"></div>
      <div class="field"><label for="f-phone">연락처 *</label><input id="f-phone" placeholder="010-0000-0000" inputmode="tel"></div>
      <div class="field"><label for="f-birth">생년월일</label><input id="f-birth" type="date"></div>
      <div class="field"><label for="f-renew">상령일 <span class="hint">· 생일 +6개월 자동 계산, 수정 불가</span></label><input id="f-renew" class="locked" readonly placeholder="생년월일 입력 시 자동"></div>
      <div class="field"><label for="f-lastcontact">마지막 접촉일 <span class="hint">· 6개월 지나면 장기미접촉</span></label><input id="f-lastcontact" type="date"></div>
      <div class="field"><label for="f-addr">자택 주소 <span class="hint">· 검색 후 동·호수 직접 입력</span></label>
        <div class="addr-row"><input id="f-addr" placeholder="검색을 누르거나 직접 입력"><button type="button" class="addr-btn" onclick="openPostcode('home')">검색</button></div>
      </div>
      <div class="field"><label for="f-workaddr">직장 주소 <span class="hint">· 검색 후 층·호수 직접 입력</span></label>
        <div class="addr-row"><input id="f-workaddr" placeholder="검색을 누르거나 직접 입력"><button type="button" class="addr-btn" onclick="openPostcode('work')">검색</button></div>
      </div>
      <div class="field"><label for="f-company">상호명</label><input id="f-company" placeholder="예: ○○물산 / ○○의원"></div>
      <div class="field"><label for="f-position">직급</label><input id="f-position" placeholder="예: 대표 / 과장 / 원장"></div>
      <div class="field" role="group" aria-label="가족관계"><label>가족관계 <span class="hint">· 여러 명 추가 가능</span></label>
        <div id="fam-list"></div>
        <button type="button" class="add-fam" onclick="addFamRow()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>가족 추가</button>
      </div>
      <div class="field" id="fld-memo"><label for="f-memo">고객 메모 <span class="hint">· 상담 내용·니즈·특이사항</span></label><textarea id="f-memo" rows="8" style="min-height:180px" placeholder="이 고객에 대한 메모를 넉넉하게 남겨보세요"></textarea></div>
    </div>
    <div id="grp-contract">
      <h3 class="grp-t" style="margin:22px 0 0;font-size:16px;color:var(--ink)">계약 정보</h3>
      <div class="field"><label for="f-product">가입상품</label><input id="f-product" placeholder="실손 / 종신 …"></div>
      <div class="field"><label for="f-fee">월 보험료</label><input id="f-fee" placeholder="예: 120,000" inputmode="numeric"></div>
      <div class="field" id="fld-status"><label for="f-status">고객 구분 <span class="hint">· 상령임박·장기미접촉은 날짜로 자동 표시</span></label>
        <select id="f-status"><option>신규가망</option><option>관리중</option></select>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="save-btn" id="save-btn" type="button">저장</button>
      <button class="danger-btn" id="del-btn" type="button" style="display:none">이 계약 삭제</button>
    </div>
  </div>
</div>

<nav class="nav" id="nav" style="display:none" aria-label="주 메뉴">
  <button type="button" class="on" aria-current="page" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>오늘</button>
  <button type="button" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M17 8h4M17 12h4M15 16h6"/></svg>고객</button>
  <button type="button" data-v="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>추가</button>
  <button type="button" data-v="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>지도</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="loader" id="loader" role="status" aria-live="polite"><div class="spin"></div><div class="lt" id="loader-text">불러오는 중…</div></div>
<div class="cbar" id="cbar" role="dialog" aria-label="연락 기록"><div class="t" id="cbar-text"></div><button type="button" class="no" id="cbar-no">아니요</button><button type="button" class="yes" id="cbar-yes">오늘 연락함</button></div>

<!-- 삭제 확인창 -->
<div class="cscrim" id="confirm-scrim">
  <div class="cbox" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
    <div class="cico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></div>
    <div class="ctitle" id="confirm-title">삭제할까요?</div>
    <div class="cmsg" id="confirm-msg"></div>
    <div class="crow"><button type="button" class="cbtn cancel" id="confirm-no">아니요</button><button type="button" class="cbtn danger" id="confirm-yes">네, 삭제</button></div>
  </div>
</div>

<!-- 길찾기 자택/직장 선택창 -->
<div class="cscrim" id="nav-scrim">
  <div class="cbox" role="dialog" aria-modal="true" aria-labelledby="nav-title">
    <div class="ctitle" id="nav-title">어디로 안내할까요?</div>
    <div class="cmsg" id="nav-name" style="margin-bottom:12px"></div>
    <div class="navopt">
      <button type="button" onclick="navPick('home')"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span style="flex:1;min-width:0"><b>자택</b><span id="nav-home"></span></span></button>
      <button type="button" onclick="navPick('work')"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/></svg><span style="flex:1;min-width:0"><b>직장</b><span id="nav-work"></span></span></button>
    </div>
    <button type="button" class="cbtn cancel" style="width:100%" onclick="closeNav()">취소</button>
  </div>
</div>

<!-- 접속 화면 -->
<div class="hloader" id="hloader" role="status" aria-live="polite">
  <div class="hl-mark" aria-hidden="true">H</div>
  <div class="hl-word">헤리티지 고객관리</div>
  <div class="hl-sub">접속 중…</div>
</div>

<script>
var ME=null;
var SVG_CALL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
var CLOSE_SVG='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var CLOSE_BTN='<button class="sheet-close" type="button" onclick="closeDetail()" aria-label="닫기">'+CLOSE_SVG+'</button>';
var PLUS_ICO='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
/* ===== 서버 통신 (GitHub Pages ↔ Apps Script) =====
   fetch를 먼저 시도하고, 실패하면 JSONP(스크립트 태그)로 자동 재시도합니다.

var API_URL="https://script.google.com/macros/s/AKfycbwFRh_N_a2h_zwQoeO0lVQ2IstBvISBWCdt1cu-BIRvaEo27wwormbCEn_xDeCaGbdu/exec";
var _cbSeq=0;
function _qs(fn,args){return "action="+encodeURIComponent(fn)+"&args="+encodeURIComponent(JSON.stringify(args))}
function _jsonp(fn,args){
  return new Promise(function(resolve,reject){
    var cb="__cb"+(++_cbSeq)+"_"+(new Date().getTime());
    var s=document.createElement("script");
    var timer=setTimeout(function(){cleanup();reject(new Error("요청 시간 초과"));},25000);
    function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}if(s.parentNode)s.parentNode.removeChild(s)}

function server(fn){

function monthsSince(d){if(!d)return null;var t=new Date(d);if(isNaN(t))return null;t.setHours(0,0,0,0);return (TODAY-t)/(864e5*30.4375)}
function won(n){n=parseInt(String(n).replace(/[^0-9]/g,""),10);return n?n.toLocaleString("ko-KR")+"원":"-"}

function fmtPhone(p){var d=String(p==null?"":p).replace(/[^0-9]/g,"");if(d.length===11)return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);if(d.length===10)return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);return String(p||"")}

function deriveStatus(g){var d=daysTo(g.renew);g.renewD=d;g.idleM=g.last?monthsSince(g.last):null;
  if(d!==null&&d>=0&&d<=30)return "상령임박";if(g.idleM!==null&&g.idleM>=6)return "장기미접촉";return manualStatus(g)}
function buildCustomers(rows){
  var contracts=rows.map(mapRow).filter(function(c){return c.name});
  var groups={},order=[];
  contracts.forEach(function(c){
    var key=c.name.trim();   // 한 FC 탭 안에서는 이름 = 한 고객 (연락처가 빈 계약 행도 같은 고객으로 묶임)
    if(!groups[key]){groups[key]={key:key,name:c.name,phone:c.phone,addr:c.addr,birth:c.birth,family:c.family,renew:c.renew,last:c.last||"",memo:c.memo||"",workAddr:c.workAddr||"",company:c.company||"",position:c.position||"",lat:c.lat,lng:c.lng,workLat:c.workLat,workLng:c.workLng,contracts:[]};order.push(key)}
    var g=groups[key];
    if(!g.phone&&c.phone)g.phone=c.phone;if(!g.addr&&c.addr)g.addr=c.addr;if(!g.birth&&c.birth)g.birth=c.birth;
    if(!g.family&&c.family)g.family=c.family;if(!g.renew&&c.renew)g.renew=c.renew;
    if(!g.memo&&c.memo)g.memo=c.memo;
    if(!g.workAddr&&c.workAddr)g.workAddr=c.workAddr;if(!g.company&&c.company)g.company=c.company;if(!g.position&&c.position)g.position=c.position;
    if(c.last){var _cl=new Date(c.last);if(!g.last||(!isNaN(_cl)&&_cl>new Date(g.last)))g.last=c.last;}
    if((!g.lat||!g.lng)&&c.lat&&c.lng){g.lat=c.lat;g.lng=c.lng}
    if((!g.workLat||!g.workLng)&&c.workLat&&c.workLng){g.workLat=c.workLat;g.workLng=c.workLng}
    g.contracts.push(c);
  });
  return order.map(function(k,i){
    var g=groups[k];if(!g.renew&&g.birth)g.renew=clientSangryeong(g.birth);
    g.phone=fmtPhone(g.phone);
    g.id=i+1;g.feeTotal=g.contracts.reduce(function(s,c){return s+(parseInt(String(c.fee).replace(/[^0-9]/g,""),10)||0)},0);
    g.status=deriveStatus(g);
    return g;
  });
}

function myLocation(){
  if(!map){toast("지도를 불러오는 중이에요");return}
  if(!navigator.geolocation){toast("위치 기능을 지원하지 않아요");return}
  toast("현재 위치 확인 중…");
  navigator.geolocation.getCurrentPosition(function(p){setMe(p.coords.latitude,p.coords.longitude);map.setView([p.coords.latitude,p.coords.longitude],14);toast("현재 위치 표시")},
    function(){toast("위치 권한을 허용해주세요")},{enableHighAccuracy:true,timeout:8000});
}
function showNear(){
  if(!map){toast("지도를 불러오는 중이에요");return}
  if(!navigator.geolocation){toast("위치 기능을 지원하지 않아요");return}
  toast("현재 위치 확인 중…");
  navigator.geolocation.getCurrentPosition(function(p){placeMe(p.coords.latitude,p.coords.longitude)},
    function(){toast("위치 권한이 없어 지도 중심 기준으로 표시합니다");var c=map.getCenter();placeMe(c.lat,c.lng)},{enableHighAccuracy:true,timeout:8000});
}
function placeMe(la,ln){
  setMe(la,ln);if(meCircle)map.removeLayer(meCircle);
  meCircle=L.circle([la,ln],{radius:3000,color:"#1c3a6e",weight:1,fillColor:"#1c3a6e",fillOpacity:.08}).addTo(map);
  customers.forEach(function(c){c._dist=c.lat?haversine(la,ln,c.lat,c.lng):null});
  map.setView([la,ln],13);sortKey="dist";
  var near=customers.filter(function(c){return c._dist!=null&&c._dist<=3});
  toast(near.length?"반경 3km 내 고객 "+near.length+"명":"반경 3km 내 고객이 없어요");renderList();
}
function haversine(la1,ln1,la2,ln2){var R=6371,rad=function(x){return x*Math.PI/180};var dLa=rad(la2-la1),dLn=rad(ln2-ln1);var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(rad(la1))*Math.cos(rad(la2))*Math.sin(dLn/2)*Math.sin(dLn/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

function tmapGo(addr,lat,lng){

  var href=(lat&&lng)?("tmap://route?goalname="+encodeURIComponent(addr)+"&goalx="+lng+"&goaly="+lat):("tmap://search?name="+encodeURIComponent(addr));
  var left=false,onHide=function(){if(document.visibilityState==="hidden")left=true};
  document.addEventListener("visibilitychange",onHide);
  location.href=href;
  setTimeout(function(){document.removeEventListener("visibilitychange",onHide);if(left)return;   // 티맵이 안 열렸으면 카카오맵(웹)으로
    toast("티맵이 없어서 카카오맵으로 열어요");
    location.href=(lat&&lng)?("https://map.kakao.com/link/to/"+encodeURIComponent(addr)+","+lat+","+lng):("https://map.kakao.com/link/search/"+encodeURIComponent(addr));},1600);
}

function copyText(t){
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t);return true}}catch(e){}
  try{var ta=document.createElement("textarea");ta.setAttribute("readonly","");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);return true}catch(e){return false}
}

$("#logout-btn").addEventListener("click",function(){showConfirm("로그아웃할까요?","다시 들어올 때 성명과 주민번호 뒷자리를 입력해야 해요.",doLogout,"로그아웃","brand")});
document.querySelectorAll(".nav button").forEach(function(b){b.addEventListener("click",function(){go(b.dataset.v)})});
$("#search").addEventListener("input",function(e){query=e.target.value;renderList()});
$("#chips").addEventListener("click",function(e){var c=e.target.closest(".chip");if(!c)return;setFilter(c.dataset.f)});
$("#to-list").addEventListener("click",showAll);
$("#sort").addEventListener("change",function(){sortKey=this.value;renderList()});
$("#detail-sheet").addEventListener("input",function(e){var t=e.target;if(!t||!t.id||t.id.indexOf("odf-")!==0||!odOpenForm)return;var d=odDraft[odOpenForm]=odDraft[odOpenForm]||{};d[t.id]=t.value});
$("#cbar-yes").addEventListener("click",function(){markContacted(+$("#cbar").dataset.id)});
$("#cbar-no").addEventListener("click",function(){$("#cbar").classList.remove("on")});
$("#f-fee").addEventListener("input",function(){this.value=fmtFee(this.value)});
$("#near-btn").addEventListener("click",showNear);
$("#all-btn").addEventListener("click",fitAll);
$("#loc-btn").addEventListener("click",myLocation);
$("#f-birth").addEventListener("change",syncSangryeong);
$("#f-phone").addEventListener("input",function(){var d=this.value.replace(/[^0-9]/g,"").slice(0,11),v=d;if(d.length>=4&&d.length<8)v=d.slice(0,3)+"-"+d.slice(3);else if(d.length>=8)v=d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);this.value=v;});
$("#save-btn").addEventListener("click",saveForm);
$("#del-btn").addEventListener("click",delCustomer);
$("#confirm-no").addEventListener("click",closeConfirm);
$("#confirm-yes").addEventListener("click",function(){var cb=_confirmCb;closeConfirm();if(cb)cb()});
$("#confirm-scrim").addEventListener("click",function(e){if(e.target===this)closeConfirm()});
$("#nav-scrim").addEventListener("click",function(e){if(e.target===this)closeNav()});
document.querySelectorAll(".scrim").forEach(function(s){s.addEventListener("click",function(e){if(e.target!==s)return;if(s.id==="form-scrim"){if(formDirty){warnDirty();return}closeForm();return}if(s.id==="detail-scrim"){closeDetail();return}s.classList.remove("on");afterClose()})});
$("#form-scrim").addEventListener("input",function(){formDirty=true});$("#form-scrim").addEventListener("change",function(){formDirty=true});

(function(){var t=getToken();if(!t){return}heritageLoader(true);server("apiMe",t).then(function(res){if(res.ok)enterApp(res.user);else heritageLoader(false)}).catch(function(){heritageLoader(false)})})();
</script>
