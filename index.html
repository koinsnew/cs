<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객관리</title>
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
  :root{
    --bg:#eceef3;--surface:#fff;--surface-2:#f6f7fb;
    --ink:#0e1220;--ink-2:#454c60;--muted:#5f6679;--line:#e3e6ee;
    --brand:#4a54e1;--brand-2:#6a5cf0;--brand-deep:#191d4e;
    --red:#e24d4d;--amber:#e0912a;--green:#12a594;--violet:#7a6cf0;
    --grad:linear-gradient(135deg,#4a54e1 0%,#6a5cf0 100%);
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow:0 6px 22px rgba(23,31,70,.07);
    --shadow-lg:0 22px 50px rgba(20,26,70,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  ::selection{background:rgba(74,84,225,.2);color:inherit}
  input,textarea,select{caret-color:var(--brand)}
  ::placeholder{color:#646b7f;opacity:1}
  :focus-visible{outline:3px solid rgba(74,84,225,.6);outline-offset:2px;border-radius:12px}
  .num{font-variant-numeric:tabular-nums}
  .ico{width:16px;height:16px;flex:0 0 auto;vertical-align:-3px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  html,body{margin:0;padding:0}
  body{font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:62px;display:none}
  .app.on{display:block}

  /* 로그인 */
  .login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;
    background:radial-gradient(1200px 600px at 50% -10%,#2b2f77 0%,#191d4e 45%,#12153a 100%)}
  .login::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 400px at 80% 110%,rgba(106,92,240,.35),transparent 60%);pointer-events:none}
  .login.hide{display:none}
  .login-card{position:relative;background:rgba(255,255,255,.98);border-radius:26px;width:100%;max-width:384px;padding:38px 28px 30px;box-shadow:var(--shadow-lg)}
  .login-logo{width:64px;height:64px;border-radius:20px;background:var(--grad);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(74,84,225,.4)}
  .login-logo svg{width:34px;height:34px;color:#fff}
  .login h1{text-align:center;margin:0 0 4px;font-size:25px;font-weight:800;letter-spacing:-.03em}
  .login .desc{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:26px;letter-spacing:0}
  .login label{display:block;font-size:13px;color:var(--ink-2);font-weight:700;margin:14px 2px 7px;letter-spacing:0}
  .login input{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px 15px;font-size:15px;outline:none;transition:.15s;font-family:inherit}
  .login input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(74,84,225,.1)}
  .login-btn{width:100%;background:var(--grad);color:#fff;border:none;border-radius:15px;padding:16px;font-size:16px;font-weight:800;margin-top:24px;cursor:pointer;box-shadow:0 10px 24px rgba(74,84,225,.32)}
  .login-btn:active{transform:translateY(1px)}
  .login-btn:disabled{opacity:.6}
  .login-err{color:#c62828;font-size:13px;text-align:center;margin-top:14px;min-height:18px;font-weight:600}
  .login-note{color:var(--muted);font-size:12px;text-align:center;margin-top:6px;line-height:1.5}

  .appbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);padding:15px 18px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .appbar .brand{display:flex;align-items:center;gap:11px}
  .appbar .mark{width:34px;height:34px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(74,84,225,.32)}
  .appbar .mark svg{width:19px;height:19px;color:#fff}
  .appbar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em}
  .appbar .who{color:var(--muted);font-size:12.5px;margin-top:1px}
  .appbar .who b{color:var(--brand);font-weight:700}
  .logout{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;font-size:13px;color:var(--ink-2);font-weight:600;cursor:pointer;font-family:inherit}

  .view{display:none;padding:18px 16px}
  .view.active{display:block;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hello{margin:2px 2px 16px}
  .hello .h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
  .hello .h2{color:var(--muted);font-size:13px;margin-top:3px}

  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
  .qf{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 6px 10px;min-height:64px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:var(--shadow-sm)}
  .qf .n{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .qf .l{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;white-space:nowrap}
  .qf.hot .n{color:#c62828}.qf.warn .n{color:#8a5a00}.qf.new .n{color:#5b3fd6}
  .qf:active{transform:scale(.97)}
  .ic-blue{background:rgba(74,84,225,.12);color:var(--brand)}.ic-red{background:rgba(226,77,77,.12);color:var(--red)}
  .ic-amber{background:rgba(224,145,42,.14);color:var(--amber)}.ic-green{background:rgba(18,165,148,.13);color:var(--green)}
  /* 연체·실효 큰 카드 */
  .od-card{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;margin:4px 0 16px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#c8233f 0%,#a3184a 100%);box-shadow:0 14px 30px rgba(163,24,74,.28);transition:.15s}
  .od-card:active{transform:scale(.985)}
  .od-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.10)}
  .od-card .od-top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
  .od-card .od-top svg{width:20px;height:20px}
  .od-card .od-big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin:10px 0 4px}
  .od-card .od-big small{font-size:18px;font-weight:800;margin-left:4px}
  .od-card .od-sub{font-size:14px;font-weight:600}
  .od-card .od-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .od-card .od-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .od-card .od-go{margin-top:16px;background:#fff;color:#a3184a;border-radius:14px;padding:13px;text-align:center;font-weight:800;font-size:15px}
  .od-ok{border-radius:16px;padding:12px 14px;margin:4px 0 14px;background:#e9f7f3;color:#0a6b5f;font-weight:700;font-size:13.5px;border:1px solid #cdeee6;display:flex;align-items:center;gap:8px}
  .od-item{background:var(--surface);border:1.5px solid #f3c9cf;border-radius:22px;padding:18px 17px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .od-item.lapse{border-color:#f0a7b2;background:linear-gradient(180deg,#fff5f6 0%,#fff 60%)}
  .od-item .oi-name{font-size:22px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .od-item .oi-prod{color:var(--ink-2);font-size:13.5px;margin-top:6px;line-height:1.5}
  .od-item .oi-money{display:flex;gap:10px;margin-top:14px}
  .od-item .oi-box{flex:1;background:var(--surface-2);border-radius:14px;padding:11px 12px}
  .od-item .oi-box .k{font-size:12px;color:var(--muted);font-weight:700}
  .od-item .oi-box .v{font-size:18px;font-weight:900;margin-top:2px;letter-spacing:-.02em}
  .od-item .oi-box.neg .v{color:#d0243f}
  .od-item .oi-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;font-size:13px}
  .od-item .oi-grid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:6px 0}
  .od-item .oi-grid span:first-child{color:var(--muted);white-space:nowrap}
  .od-item .oi-grid span:last-child{font-weight:700;text-align:right}
  .od-item .oi-none{margin-top:12px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px;text-align:center}
  .b-lapse{background:#c8233f;color:#fff}.b-late{background:#8a5a00;color:#fff}.b-chk{background:#eef0f5;color:#454c60}
  .b-track{background:#fbf0df;color:#8a5a00}.b-ok{background:#e2f6f2;color:#0a6b5f}.b-end{background:#2b2f3a;color:#fff}.b-new{background:#fdecec;color:#b42323}
  .od-log{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:13px;color:var(--ink-2);line-height:1.55}
  .od-log b{color:var(--ink)}
  .od-form{margin-top:14px;border-top:1px dashed #f0a7b2;padding-top:12px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;min-height:44px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;font-weight:700;font-size:14px;font-family:inherit;color:var(--ink-2);cursor:pointer}
  .seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
  .od-rec{width:100%;margin-top:12px;min-height:46px;border-radius:14px;border:1.5px solid #c8233f;background:#fff;color:#a3184a;font-weight:800;font-size:14.5px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .section-title{font-size:14px;font-weight:800;color:var(--ink-2);margin:22px 4px 10px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px 15px 14px;margin-bottom:11px;box-shadow:var(--shadow);transition:.15s;cursor:pointer}
  .card:active{transform:scale(.992)}
  .card .top{display:flex;align-items:flex-start;gap:12px}
  .avatar{width:46px;height:46px;border-radius:14px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;box-shadow:0 4px 10px rgba(20,26,70,.14)}
  .grow{flex:1;min-width:0}
  .name{font-weight:800;font-size:16.5px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .meta{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:6px;min-width:0}
  .meta .p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta .f{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
  .note{font-size:12.5px;font-weight:700;margin-top:5px;color:#b42323}.note.idle{color:#8a5a00}.note.ok{color:var(--muted);font-weight:600}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .b-red{background:#fdecec;color:#b42323}.b-amber{background:#fbf0df;color:#8a5a00}
  .b-green{background:#e2f6f2;color:#0a7c6e}.b-violet{background:#efeaff;color:#5b3fd6}.b-gray{background:#eef1f6;color:#5b6472}
  .cc{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--brand);color:#fff}
  .addr{margin-top:11px;color:var(--ink-2);font-size:13px;word-break:keep-all;overflow-wrap:anywhere;display:flex;gap:6px;align-items:flex-start;background:var(--surface-2);padding:9px 11px;border-radius:11px}
  .addr svg{flex:0 0 14px;margin-top:2px;opacity:.55}
  .dist{color:var(--brand);font-weight:700}
  .actions{display:flex;flex-wrap:nowrap;gap:7px;margin-top:12px}
  .act{flex:1 1 0;min-width:0;min-height:44px;white-space:nowrap;border:none;border-radius:12px;padding:11px 0;font-weight:700;font-size:13px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;text-decoration:none;transition:.15s}
  .act:active{transform:scale(.96)}
  .act.call{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(74,84,225,.28)}
  .act.sms{background:var(--surface-2);color:var(--brand);border:1px solid var(--line)}
  .act.route{background:#e2f6f2;color:#0a7c6e;border:1px solid #cdeee7}
  .act.kakao{background:#fff7b8;color:#3a1d1d;border:1px solid #f2e27a}
  .touch{width:100%;margin-top:10px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:800;font-size:14.5px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .touch.done{color:#0a6b5f;background:#e9f7f3;border-color:#cdeee6}
  .act svg{width:16px;height:16px}

  .search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:15px;padding:13px 15px;font-size:14.5px;margin-bottom:12px;outline:none;font-family:inherit;box-shadow:var(--shadow-sm)}
  .search:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(74,84,225,.1)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);min-height:40px;padding:0 15px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip:last-child{margin-right:24px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .map-wrap{position:relative}
  #map{height:calc(100vh - 250px);min-height:320px;border-radius:20px;border:1px solid var(--line);z-index:1;box-shadow:var(--shadow)}
  .loc-fab{position:absolute;right:14px;bottom:16px;z-index:5;width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .loc-fab svg{width:22px;height:22px;color:var(--brand)}
  .maprow{display:flex;gap:9px;margin-bottom:12px}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 15px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:7px;justify-content:center;box-shadow:var(--shadow-sm)}
  .btn.primary{background:var(--grad);color:#fff;border:none;flex:1;box-shadow:0 8px 18px rgba(74,84,225,.28)}
  .btn svg{width:16px;height:16px}
  .pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
  .legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;padding:3px 6px calc(3px + env(safe-area-inset-bottom))}
  .nav button{flex:1;background:none;border:none;padding:4px 0;min-height:50px;color:var(--muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit}
  .nav button.on,.nav button[aria-current="page"]{color:var(--brand)}
  .nav svg{width:20px;height:20px}
  .nav .fab .ic{background:var(--grad);width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-top:-13px;box-shadow:0 8px 18px rgba(74,84,225,.42);color:#fff}
  .nav .fab .ic svg{width:21px;height:21px}

  .scrim{position:fixed;inset:0;background:rgba(14,18,32,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .scrim.on{display:flex}
  .sheet{position:relative;background:var(--surface);width:100%;max-width:520px;border-radius:26px 26px 0 0;max-height:92vh;overflow-y:auto;padding:8px 20px 30px;animation:up .32s cubic-bezier(.2,.9,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grab{width:42px;height:5px;background:#dde1ea;border-radius:3px;margin:9px auto 14px}
  .sheet-close{position:absolute;top:12px;right:14px;z-index:3;width:44px;height:44px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
  .sheet h2{margin:4px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.03em;padding-right:40px}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv .k{color:var(--muted);white-space:nowrap;flex:0 0 auto}.kv .v{font-weight:600;text-align:right;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;min-width:0}
  .memo-box{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:14px;font-size:13.5px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap}

  .contract{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:10px}
  .contract .ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .contract .cp{font-weight:800;font-size:14.5px}
  .contract .cf{color:var(--muted);font-size:13px;margin-top:4px}
  .contract .cm{font-size:12.5px;color:var(--ink-2);margin-top:8px;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .contract .edit{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 14px;font-size:13px;font-family:inherit;font-weight:700;color:var(--brand);cursor:pointer;white-space:nowrap}
  .add-contract{width:100%;margin-top:12px;background:rgba(74,84,225,.08);color:var(--brand);border:1px dashed rgba(74,84,225,.4);border-radius:14px;padding:13px;font-weight:700;font-size:13.5px;cursor:pointer}
  .fam-row{display:flex;gap:8px;margin-bottom:8px}
  .fam-row input{border:1.5px solid var(--line);background:var(--surface-2);border-radius:13px;padding:12px 13px;font-size:14.5px;font-family:inherit;outline:none;transition:.15s}
  .fam-row input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(74,84,225,.1)}
  .fam-row .fam-rel{flex:0 0 38%}.fam-row .fam-name{flex:1;min-width:0}
  .fam-row .fam-del{flex:0 0 auto;width:46px;border:1px solid var(--line);background:#fff;border-radius:13px;color:var(--muted);font-weight:700;cursor:pointer}
  .add-fam{width:100%;background:rgba(74,84,225,.08);color:var(--brand);border:1px dashed rgba(74,84,225,.4);border-radius:13px;padding:11px;font-weight:700;font-size:13px;cursor:pointer}

  .field{margin-top:13px}
  .field label{display:block;font-size:13px;color:var(--ink-2);font-weight:700;margin-bottom:6px}
  .field .hint{color:var(--muted);font-weight:500;font-size:12px}
  .field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:13px;padding:12px 13px;font-size:14.5px;font-family:inherit;outline:none;transition:.15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(74,84,225,.1)}
  .field textarea{resize:vertical}
  .field .locked{background:#eef0f5;color:var(--ink-2);cursor:not-allowed;font-weight:700}
  .field .err{display:block;color:#b42323;font-size:12.5px;font-weight:700;margin-top:6px}
  .field.invalid input{border-color:#c62828}
  .field .addr-row{display:flex;gap:8px}
  .field .addr-row input{flex:1;cursor:pointer}
  .field .addr-btn{flex:0 0 auto;background:var(--ink);color:#fff;border:none;border-radius:13px;padding:0 16px;font-weight:700;font-size:13.5px;cursor:pointer}
  .save-btn{width:100%;background:var(--grad);color:#fff;border:none;border-radius:15px;padding:16px;font-size:15.5px;font-weight:800;margin-top:20px;cursor:pointer;box-shadow:0 10px 22px rgba(74,84,225,.3)}
  .save-btn:active{transform:translateY(1px)}
  .empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:14px}
  .toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));text-align:center;line-height:1.45;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 19px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:.3s;pointer-events:none;max-width:90%;box-shadow:var(--shadow-lg)}
  .toast.on{opacity:1}
  .loader{position:fixed;inset:0;background:rgba(236,238,243,.78);display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;z-index:70}
  .loader .lt{font-size:14px;font-weight:700;color:var(--ink-2)}
  .loader.on{display:flex}
  .spin{width:36px;height:36px;border:3px solid #dfe3ee;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:75;width:calc(100% - 24px);max-width:496px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 12px 12px 16px;display:none;align-items:center;gap:10px;box-shadow:var(--shadow-lg)}
  .cbar.on{display:flex;animation:up .3s cubic-bezier(.2,.9,.2,1)}
  .cbar .t{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.4}
  .cbar button{min-height:44px;border:none;border-radius:12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;padding:0 14px}
  .cbar .yes{background:#fff;color:var(--ink)}.cbar .no{background:transparent;color:#cfd3de}
  .navopt{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .navopt button{min-height:56px;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;text-align:left;padding:10px 14px;font-family:inherit;cursor:pointer;display:flex;gap:10px;align-items:center}
  .navopt button b{display:block;font-size:15px;color:var(--ink)}.navopt button span{display:block;font-size:12.5px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
  /* 삭제 확인창 */
  .cscrim{position:fixed;inset:0;background:rgba(14,18,32,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:210;display:none;align-items:center;justify-content:center;padding:28px}
  .cscrim.on{display:flex;animation:hlfade .2s ease both}
  .cbox{background:#fff;border-radius:22px;width:100%;max-width:322px;padding:26px 22px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.32);animation:up .28s cubic-bezier(.2,.9,.2,1)}
  .cbox .cico{width:56px;height:56px;border-radius:50%;background:#fdecec;color:#e24d4d;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .cbox .cico svg{width:28px;height:28px}
  .cbox .ctitle{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;color:var(--ink)}
  .cbox .cmsg{font-size:14px;color:var(--ink-2);line-height:1.6;margin-bottom:20px;word-break:keep-all}
  .cbox .crow{display:flex;gap:9px}
  .cbtn{flex:1;min-height:48px;border-radius:13px;padding:13px 0;font-weight:800;font-size:14.5px;font-family:inherit;cursor:pointer;border:none}
  .cbtn.cancel{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .cbtn.danger{background:#c62828;color:#fff;box-shadow:0 8px 18px rgba(198,40,40,.28)}
  .cbtn.brand{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(74,84,225,.35)}
  .cbtn:active{transform:translateY(1px)}
  /* 헤리티지 프로 로그인 스플래시 */
  .hloader{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(1100px 760px at 50% 28%,#2b3374 0%,#1b2054 55%,#12153a 100%);color:#fff;-webkit-font-smoothing:antialiased}
  .hloader.on{display:flex;animation:hlfade .45s ease both}
  .hloader.out{animation:hlout .5s ease forwards}
  .hloader::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(106,92,240,.45),transparent 62%);filter:blur(24px);animation:hlpulse 2.8s ease-in-out infinite}
  .hloader::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 75% 25%,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 60% 70%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 35% 80%,rgba(255,255,255,.35),transparent);opacity:.7;animation:hltwinkle 4s ease-in-out infinite}
  .hl-emblem{position:relative;width:106px;height:106px;border-radius:30px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#4a54e1,#6a5cf0);box-shadow:0 22px 55px rgba(74,84,225,.6),inset 0 1px 0 rgba(255,255,255,.35);animation:hlfloat 3s ease-in-out infinite}
  .hl-emblem::after{content:"";position:absolute;inset:-12px;border-radius:40px;border:2px solid rgba(255,255,255,.22);animation:hlring 2.4s ease-out infinite}
  .hl-emblem svg{width:58px;height:58px}
  .hl-emblem svg path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .hl-shield{opacity:.95}
  .hl-check{stroke-dasharray:20;stroke-dashoffset:20;animation:hldraw 2s ease-in-out infinite}
  .hl-word{margin-top:32px;font-size:22px;font-weight:800;letter-spacing:.06em;transform:translateY(12px);opacity:0;animation:hlup .8s cubic-bezier(.2,.7,.2,1) .2s forwards}
  .hl-sub{margin-top:9px;font-size:13px;font-weight:700;letter-spacing:.28em;color:rgba(255,255,255,.66);transform:translateY(12px);opacity:0;animation:hlup .8s cubic-bezier(.2,.7,.2,1) .4s forwards}
  .hl-bar{margin-top:34px;width:158px;height:4px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden;opacity:0;animation:hlup .6s ease .6s forwards}
  .hl-bar span{display:block;width:42%;height:100%;border-radius:999px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:hlslide 1.25s ease-in-out infinite}
  @keyframes hlfade{from{opacity:0}to{opacity:1}}
  @keyframes hlout{to{opacity:0;visibility:hidden}}
  @keyframes hlpulse{0%,100%{transform:scale(.82);opacity:.45}50%{transform:scale(1.12);opacity:.8}}
  @keyframes hltwinkle{0%,100%{opacity:.35}50%{opacity:.8}}
  @keyframes hlfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes hlring{0%{transform:scale(.92);opacity:.85}100%{transform:scale(1.4);opacity:0}}
  @keyframes hldraw{0%{stroke-dashoffset:20}45%{stroke-dashoffset:0}72%{stroke-dashoffset:0}100%{stroke-dashoffset:20}}
  @keyframes hlup{to{opacity:1;transform:translateY(0)}}
  @keyframes hlslide{0%{transform:translateX(-170%)}100%{transform:translateX(430%)}}
  @media(prefers-reduced-motion:reduce){.hloader *,.hloader::before,.hloader::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login" id="login">
  <div class="login-card">
    <div class="login-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4v6c0 5 3.4 7.7 8 9 4.6-1.3 8-4 8-9V7z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <h1>고객관리</h1>
    <div class="desc">헤리티지 고객관리 시스템</div>
    <form id="login-form" onsubmit="event.preventDefault();doLogin()">
    <label for="in-name">성명</label>
    <input id="in-name" placeholder="홍길동" autocomplete="name">
    <label for="in-jumin">주민번호 뒷자리</label>
    <input id="in-jumin" placeholder="7자리 숫자" inputmode="numeric" autocomplete="current-password" type="password" maxlength="7">
    <button class="login-btn" id="login-btn" type="submit">로그인</button>
    </form>
    <div class="login-note">주민번호 뒷자리는 본인 확인에만 쓰이고 저장되지 않아요</div>
    <div class="login-err" id="login-err" role="alert"></div>
  </div>
</div>

<!-- 앱 -->
<div class="app" id="app">
  <div class="appbar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4v6c0 5 3.4 7.7 8 9 4.6-1.3 8-4 8-9V7z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div><h1>고객관리</h1><div class="who"><b id="me-name"></b> <span id="me-role"></span></div></div>
    </div>
    <button class="logout" id="logout-btn" type="button">로그아웃</button>
  </div>

  <section class="view active" id="v-today">
    <div class="hello"><div class="h1" id="hi-name">안녕하세요</div><div class="h2" id="hi-date"></div></div>
    <div id="od-wrap"></div>
    <div class="quick" role="group" aria-label="고객 빠른 보기">
      <button type="button" class="qf" data-f="전체"><span class="n num" id="s-total">0</span><span class="l">전체 고객</span></button>
      <button type="button" class="qf hot" data-f="상령임박"><span class="n num" id="s-renew">0</span><span class="l">상령 30일</span></button>
      <button type="button" class="qf warn" data-f="장기미접촉"><span class="n num" id="s-idle">0</span><span class="l">장기 미접촉</span></button>
      <button type="button" class="qf new" data-f="신규가망"><span class="n num" id="s-new">0</span><span class="l">신규 가망</span></button>
    </div>
    <h2 class="section-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>오늘 챙길 고객</h2>
    <div id="today-list"></div>
  </section>

  <section class="view" id="v-list">
    <input class="search" id="search" type="search" placeholder="이름·연락처·주소·상품·메모 검색" aria-label="고객 검색">
    <div class="chips" id="chips" role="group" aria-label="상태로 거르기">
      <button type="button" class="chip on" data-f="전체" aria-pressed="true">전체</button>
      <button type="button" class="chip" data-f="상령임박" aria-pressed="false">상령임박</button>
      <button type="button" class="chip" data-f="장기미접촉" aria-pressed="false">장기미접촉</button>
      <button type="button" class="chip" data-f="신규가망" aria-pressed="false">신규가망</button>
      <button type="button" class="chip" data-f="관리중" aria-pressed="false">관리중</button>
    </div>
    <div id="list"></div>
  </section>

  <section class="view" id="v-map">
    <div class="maprow">
      <button class="btn primary" id="near-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>내 주변 고객</button>
      <button class="btn" id="all-btn">전체 보기</button>
    </div>
    <div class="map-wrap">
      <div id="map"></div>
      <button class="loc-fab" id="loc-btn" type="button" aria-label="내 위치 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
    <div class="legend">
      <span><i style="background:#c62828"></i>상령임박</span>
      <span><i style="background:#b7791f"></i>장기미접촉</span>
      <span><i style="background:#5b3fd6"></i>신규가망</span>
      <span><i style="background:#0a7c6e"></i>관리중</span>
    </div>
  </section>
</div>

<div class="scrim" id="detail-scrim"><div class="sheet" id="detail-sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>

<div class="scrim" id="form-scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="form-title" tabindex="-1">
    <button class="sheet-close" type="button" onclick="closeForm()" aria-label="닫기">✕</button>
    <div class="grab"></div>
    <h2 id="form-title">신규 고객 추가</h2>
    <input type="hidden" id="f-row">
    <div id="grp-person">
      <div class="field"><label for="f-name">이름 *</label><input id="f-name" placeholder="홍길동"></div>
      <div class="field"><label for="f-phone">연락처 *</label><input id="f-phone" placeholder="010-0000-0000" inputmode="tel"></div>
      <div class="field"><label for="f-birth">생년월일</label><input id="f-birth" type="date"></div>
      <div class="field"><label for="f-renew">상령일 <span class="hint">· 생년월일 기준 자동 계산 (생일 +6개월) · 수정 불가</span></label><input id="f-renew" class="locked" readonly placeholder="생년월일 입력 시 자동"></div>
      <div class="field"><label for="f-lastcontact">마지막 접촉일 <span class="hint">· 6개월 지나면 자동으로 장기미접촉 표시</span></label><input id="f-lastcontact" type="date"></div>
      <div class="field"><label for="f-addr">자택 주소 <span class="hint">· 검색 후 동/호수까지 직접 입력 가능</span></label>
        <div class="addr-row"><input id="f-addr" placeholder="검색을 누르거나 직접 입력"><button type="button" class="addr-btn" onclick="openPostcode('home')">검색</button></div>
      </div>
      <div class="field"><label for="f-workaddr">직장 주소 <span class="hint">· 검색 후 층/호수까지 직접 입력 가능</span></label>
        <div class="addr-row"><input id="f-workaddr" placeholder="검색을 누르거나 직접 입력"><button type="button" class="addr-btn" onclick="openPostcode('work')">검색</button></div>
      </div>
      <div class="field"><label for="f-company">상호명</label><input id="f-company" placeholder="예: ○○물산 / ○○의원"></div>
      <div class="field"><label for="f-position">직급</label><input id="f-position" placeholder="예: 대표 / 과장 / 원장"></div>
      <div class="field" role="group" aria-label="가족관계"><label>가족관계 <span class="hint">· ＋로 여러 명 추가 (중복 가능)</span></label>
        <div id="fam-list"></div>
        <button type="button" class="add-fam" onclick="addFamRow()">＋ 가족 추가</button>
      </div>
      <div class="field" id="fld-memo"><label for="f-memo">고객 메모 <span class="hint">· 상담 내용·니즈·특이사항 자유롭게</span></label><textarea id="f-memo" rows="8" style="min-height:180px" placeholder="이 고객에 대한 메모를 넉넉하게 남겨보세요"></textarea></div>
    </div>
    <div id="grp-contract">
      <h3 class="section-title" style="margin:18px 4px 6px">계약 정보</h3>
      <div class="field"><label for="f-product">가입상품</label><input id="f-product" placeholder="실손 / 종신 …"></div>
      <div class="field"><label for="f-fee">월 보험료</label><input id="f-fee" placeholder="예: 120,000" inputmode="numeric"></div>
      <div class="field" id="fld-status"><label for="f-status">고객 구분 <span class="hint">· 상령임박·장기미접촉은 날짜로 자동 표시</span></label>
        <select id="f-status"><option>신규가망</option><option>관리중</option></select>
      </div>
    </div>
    <button class="save-btn" id="save-btn" type="button">저장</button>
    <button class="save-btn" id="del-btn" type="button" style="background:#fdecec;color:#b42323;box-shadow:none;display:none">이 계약 삭제</button>
  </div>
</div>

<nav class="nav" id="nav" style="display:none" aria-label="주 메뉴">
  <button type="button" class="on" aria-current="page" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>오늘</button>
  <button type="button" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M17 8h4M17 12h4M15 16h6"/></svg>고객</button>
  <button type="button" class="fab" data-v="add" aria-label="고객 추가"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></span>추가</button>
  <button type="button" data-v="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>지도</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="loader" id="loader" role="status" aria-live="polite"><div class="spin"></div><div class="lt" id="loader-text">불러오는 중…</div></div>
<div class="cbar" id="cbar" role="dialog" aria-label="연락 기록"><div class="t" id="cbar-text"></div><button type="button" class="no" id="cbar-no">아니요</button><button type="button" class="yes" id="cbar-yes">오늘 연락함</button></div>

<!-- 삭제 확인창 -->
<div class="cscrim" id="confirm-scrim">
  <div class="cbox" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
    <div class="cico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></div>
    <div class="ctitle" id="confirm-title">삭제할까요?</div>
    <div class="cmsg" id="confirm-msg"></div>
    <div class="crow"><button type="button" class="cbtn cancel" id="confirm-no">아니요</button><button type="button" class="cbtn danger" id="confirm-yes">네, 삭제</button></div>
  </div>
</div>

<!-- 길찾기 자택/직장 선택창 -->
<div class="cscrim" id="nav-scrim">
  <div class="cbox" role="dialog" aria-modal="true" aria-labelledby="nav-title">
    <div class="cico" style="background:#e2f6f2;color:#0a7c6e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg></div>
    <div class="ctitle" id="nav-title">어디로 안내할까요?</div>
    <div class="cmsg" id="nav-name" style="margin-bottom:12px"></div>
    <div class="navopt">

<script>

/* ===== 서버 통신 (GitHub Pages ↔ Apps Script) =====
   fetch를 먼저 시도하고, 실패하면 JSONP(스크립트 태그)로 자동 재시도합니다.
   아래 주소는 본인 Apps Script 웹앱 배포 주소(.../exec)로 바꾸면 됩니다. */
var API_URL="https://script.google.com/macros/s/AKfycbwFRh_N_a2h_zwQoeO0lVQ2IstBvISBWCdt1cu-BIRvaEo27wwormbCEn_xDeCaGbdu/exec";
var _cbSeq=0;
function _qs(fn,args){return "action="+encodeURIComponent(fn)+"&args="+encodeURIComponent(JSON.stringify(args))}
function _jsonp(fn,args){
  return new Promise(function(resolve,reject){
    var cb="__cb"+(++_cbSeq)+"_"+(new Date().getTime());
    var s=document.createElement("script");
    var timer=setTimeout(function(){cleanup();reject(new Error("요청 시간 초과"));},25000);
    function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}if(s.parentNode)s.parentNode.removeChild(s)}
    window[cb]=function(res){cleanup();resolve(res)};
    s.onerror=function(){cleanup();reject(new Error("네트워크 오류"))};
    s.src=API_URL+"?"+_qs(fn,args)+"&callback="+cb;
    document.body.appendChild(s);
  });
}
function server(fn){
  var args=[].slice.call(arguments,1);
  if(typeof fetch==="function"){
    var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
    var t=ctrl?setTimeout(function(){try{ctrl.abort()}catch(e){}},25000):null;
    // POST 본문으로 보내 URL 길이 제한 없이 안전하게 저장 (긴 메모도 OK). text/plain 이라 CORS 사전요청 없음.
    return fetch(API_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:fn,args:args}),signal:ctrl?ctrl.signal:undefined})
      .then(function(r){if(t)clearTimeout(t);if(!r.ok)throw new Error("HTTP "+r.status);return r.text();})
      .then(function(txt){return JSON.parse(txt);})
      .catch(function(){if(t)clearTimeout(t);return _jsonp(fn,args);});
  }
  return _jsonp(fn,args);
}
var $=function(s){return document.querySelector(s)};
var _ldT=null;

function getToken(){try{return localStorage.getItem("gk_token")||""}catch(e){return window._tk||""}}

var statusColor={상령임박:"#c62828",신규가망:"#5b3fd6",관리중:"#0a7c6e",장기미접촉:"#b7791f"};

function sColor(s){return statusColor[s]||"#8a94a6"}

function normStatus(s){return s==="신규가망"?"신규가망":"관리중"}   // FC가 정하는 구분은 2가지. 상령임박·장기미접촉은 날짜로 계산

function val(raw,keys){for(var i=0;i<keys.length;i++){for(var h in raw){if(h.replace(/\s/g,"").indexOf(keys[i])>-1&&raw[h]!=="")return raw[h];}}return ""}
function mapRow(raw){
  var ex=function(k){return raw[k]!==undefined&&raw[k]!==null?raw[k]:""};
  return {_row:raw._row,name:val(raw,["이름","성명","고객명"]),phone:String(val(raw,["연락처","전화","휴대폰"])||""),
    addr:ex("주소")||val(raw,["자택주소"]),birth:val(raw,["생년월일","생일"]),product:val(raw,["가입상품","상품"]),
    fee:val(raw,["월보험료","보험료"]),renew:val(raw,["상령일","갱신일","만기"]),status:normStatus(val(raw,["상태"])),
    family:val(raw,["가족관계","가족"]),last:val(raw,["최근접촉","최근"]),memo:ex("메모")||val(raw,["비고"]),
    workAddr:ex("직장주소"),company:ex("상호명")||val(raw,["상호","회사"]),position:ex("직급"),
    lat:parseFloat(ex("위도"))||null,lng:parseFloat(ex("경도"))||null,
    workLat:parseFloat(ex("직장위도"))||null,workLng:parseFloat(ex("직장경도"))||null};
}

var TODAY=new Date();TODAY.setHours(0,0,0,0);
function daysTo(d){if(!d)return null;var t=new Date(d);if(isNaN(t))return null;t.setHours(0,0,0,0);return Math.round((t-TODAY)/864e5)}
function monthsSince(d){if(!d)return null;var t=new Date(d);if(isNaN(t))return null;t.setHours(0,0,0,0);return (TODAY-t)/(864e5*30.4375)}
function won(n){n=parseInt(String(n).replace(/[^0-9]/g,""),10);return n?n.toLocaleString("ko-KR")+"원":"-"}
function initials(n){return n?n.slice(-2):"?"}
function fmtPhone(p){var d=String(p==null?"":p).replace(/[^0-9]/g,"");if(d.length===11)return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);if(d.length===10)return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);return String(p||"")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function clientSangryeong(b){var m=String(b||"").match(/(\d{4})\D*(\d{1,2})\D*(\d{1,2})/);if(!m)return "";var base=new Date(2000,+m[2]-1,+m[3]);base.setMonth(base.getMonth()+6);var t=new Date();t.setHours(0,0,0,0);var c=new Date(t.getFullYear(),base.getMonth(),base.getDate());if(c<t)c=new Date(t.getFullYear()+1,base.getMonth(),base.getDate());return c.getFullYear()+"-"+("0"+(c.getMonth()+1)).slice(-2)+"-"+("0"+c.getDate()).slice(-2)}

/* ===== 데이터: 계약 → 고객 그룹 ===== */
var customers=[];
function manualStatus(g){return g.contracts.some(function(c){return c.status==="신규가망"})?"신규가망":"관리중"}
/* 상태는 한 곳에서만 계산: 상령일 30일 이내 → 상령임박, 마지막 연락 6개월 이상 → 장기미접촉, 그 외 FC가 정한 구분 */
function deriveStatus(g){var d=daysTo(g.renew);g.renewD=d;g.idleM=g.last?monthsSince(g.last):null;
  if(d!==null&&d>=0&&d<=30)return "상령임박";if(g.idleM!==null&&g.idleM>=6)return "장기미접촉";return manualStatus(g)}
function buildCustomers(rows){
  var contracts=rows.map(mapRow).filter(function(c){return c.name});
  var groups={},order=[];
  contracts.forEach(function(c){
    var key=c.name.trim();   // 한 FC 탭 안에서는 이름 = 한 고객 (연락처가 빈 계약 행도 같은 고객으로 묶임)
    if(!groups[key]){groups[key]={key:key,name:c.name,phone:c.phone,addr:c.addr,birth:c.birth,family:c.family,renew:c.renew,last:c.last||"",memo:c.memo||"",workAddr:c.workAddr||"",company:c.company||"",position:c.position||"",lat:c.lat,lng:c.lng,workLat:c.workLat,workLng:c.workLng,contracts:[]};order.push(key)}
    var g=groups[key];
    if(!g.phone&&c.phone)g.phone=c.phone;if(!g.addr&&c.addr)g.addr=c.addr;if(!g.birth&&c.birth)g.birth=c.birth;
    if(!g.family&&c.family)g.family=c.family;if(!g.renew&&c.renew)g.renew=c.renew;
    if(!g.memo&&c.memo)g.memo=c.memo;
    if(!g.workAddr&&c.workAddr)g.workAddr=c.workAddr;if(!g.company&&c.company)g.company=c.company;if(!g.position&&c.position)g.position=c.position;
    if(c.last){var _cl=new Date(c.last);if(!g.last||(!isNaN(_cl)&&_cl>new Date(g.last)))g.last=c.last;}
    if((!g.lat||!g.lng)&&c.lat&&c.lng){g.lat=c.lat;g.lng=c.lng}
    if((!g.workLat||!g.workLng)&&c.workLat&&c.workLng){g.workLat=c.workLat;g.workLng=c.workLng}
    g.contracts.push(c);
  });
  return order.map(function(k,i){
    var g=groups[k];if(!g.renew&&g.birth)g.renew=clientSangryeong(g.birth);
    g.phone=fmtPhone(g.phone);
    g.id=i+1;g.feeTotal=g.contracts.reduce(function(s,c){return s+(parseInt(String(c.fee).replace(/[^0-9]/g,""),10)||0)},0);
    g.status=deriveStatus(g);
    return g;
  });
}

function noteHTML(g){
  if(g.status==="상령임박")return '<div class="note">상령일 '+(g.renewD===0?"오늘":"D-"+g.renewD)+' · '+esc(g.renew)+'</div>';

    '<div class="actions">'+

var overdue=null,odLogs={},odOpenForm=null,odResult={};

function loadOverdue(){
  return Promise.all([server("apiGetOverdue",getToken()),server("apiGetOverdueLogs",getToken()).catch(function(){return null})]).then(function(r){
    var res=r[0],lg=r[1];
    if(!res||!res.ok){overdue=null;renderOverdueCard();return}
    odLogs={};((lg&&lg.ok&&lg.logs)||[]).forEach(function(l){var k=String(l["관리ID"]||"");(odLogs[k]=odLogs[k]||[]).push(l)});
    Object.keys(odLogs).forEach(function(k){odLogs[k].sort(function(a,b){return String(b["작성일시"]).localeCompare(String(a["작성일시"]))})});
    overdue=(res.items||[]).slice().sort(function(a,b){
      var da=/정상화|해지확정/.test(a["상태"]||"")?1:0,db=/정상화|해지확정/.test(b["상태"]||"")?1:0;if(da!==db)return da-db;
      var la=/실효/.test(odType(a))?0:1,lb=/실효/.test(odType(b))?0:1;if(la!==lb)return la-lb;return num(a["예상환수액"])-num(b["예상환수액"])});
    renderOverdueCard();

}
function renderOverdueCard(){

    '<div class="od-big num">'+open.length+'<small>건</small></div>'+

}

function openOdForm(id){odOpenForm=id;if(id&&!odResult[id])odResult[id]="추적중";openOverdue(id)}
function pickOd(id,v){odResult[id]=v;document.querySelectorAll("#od-"+CSS.escape(id)+" .seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.textContent===v))});var w=$("#odf-next-wrap");if(w)w.style.display=v==="추적중"?"":"none"}
function saveOd(id){
  var p={id:id,result:odResult[id]||"",talkDate:$("#odf-date").value,nextCheck:($("#odf-next")||{}).value||"",reason:$("#odf-reason").value.trim(),content:$("#odf-content").value.trim(),plan:$("#odf-plan").value.trim()};
  if(!p.result){toast("결과를 골라 주세요");return}
  if(!p.talkDate){toast("면담일을 정해 주세요");$("#odf-date").focus();return}
  if(p.result==="추적중"&&!p.nextCheck){toast("추적중이면 다음 확인일을 정해 주세요");$("#odf-next").focus();return}
  if(p.content.length<5){toast("면담 내용을 5자 이상 적어 주세요");$("#odf-content").focus();return}
  showLoader(true);
  server("apiLogOverdue",getToken(),p).then(function(res){
    if(!res||!res.ok){showLoader(false);toast("저장 실패"+(res&&res.msg?": "+res.msg:"")+" · 적은 내용은 그대로 있어요");return}
    odOpenForm=null;delete odResult[id];
    loadOverdue().then(function(){showLoader(false);toast("면담 기록을 저장했어요");openOverdue()});
  }).catch(function(e){showLoader(false);toast("저장 오류: "+e.message+" · 적은 내용은 그대로 있어요")});
}

    '<button class="save-btn" style="background:var(--surface-2);color:var(--brand);box-shadow:none;border:1px solid var(--line);margin-top:14px" onclick="editPerson('+g.id+')">고객 정보 수정</button>'+

function kv(k,v){return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+(v||"-")+'</span></div>'}
var _lastFocus=null,_fromPop=false,_skipPop=false;
function openSheet(sel){var el=$(sel);if(!el.classList.contains("on"))_lastFocus=document.activeElement;el.classList.add("on");guardPush();var d=el.querySelector('[role="dialog"],[role="alertdialog"]')||el;setTimeout(function(){try{d.focus({preventScroll:true})}catch(e){}},30)}
function afterClose(){if(!overlaysOpen()){if(_guard&&!_fromPop){_guard=false;_skipPop=true;try{history.back()}catch(e){_skipPop=false}}if(_lastFocus&&document.contains(_lastFocus)){try{_lastFocus.focus({preventScroll:true})}catch(e){}}_lastFocus=null}}
function closeDetail(){$("#detail-scrim").classList.remove("on");odOpenForm=null;afterClose()}
var formDirty=false;
function closeForm(){formDirty=false;$("#form-scrim").classList.remove("on");afterClose()}
function closeNav(){$("#nav-scrim").classList.remove("on");afterClose()}
function warnDirty(){toast("작성 중인 내용이 있어요 · 저장하거나 ✕를 눌러 닫아 주세요")}
var _confirmCb=null;
function showConfirm(title,msg,cb,yes,tone){$("#confirm-title").textContent=title;$("#confirm-msg").innerHTML=msg;_confirmCb=cb;var y=$("#confirm-yes");y.textContent=yes||"네, 삭제";y.className="cbtn "+(tone||"danger");$("#confirm-scrim .cico").style.display=tone==="brand"?"none":"";openSheet("#confirm-scrim");setTimeout(function(){$("#confirm-no").focus()},40)}
function closeConfirm(){$("#confirm-scrim").classList.remove("on");_confirmCb=null;afterClose()}
function askDeletePerson(id){var g=findPerson(id);if(!g)return;showConfirm("이 고객을 삭제할까요?","<b>"+esc(g.name)+"</b> 님과 계약 "+g.contracts.length+"건이 모두 삭제됩니다.<br>이 작업은 되돌릴 수 없어요.",function(){deletePerson(g)})}
function deletePerson(g){showLoader(true);server("apiDeletePerson",getToken(),g.name).then(function(res){if(res&&res.ok){closeDetail();toast("삭제했어요");loadCustomers()}else{showLoader(false);toast("삭제 실패")}}).catch(function(e){showLoader(false);toast("삭제 오류: "+e.message)})}
/* ===== 모바일 뒤로가기: 열린 창을 닫고 앱은 유지 ===== */
var _guard=false;
function overlaysOpen(){return $("#nav-scrim").classList.contains("on")||$("#confirm-scrim").classList.contains("on")||$("#form-scrim").classList.contains("on")||$("#detail-scrim").classList.contains("on")}
function guardPush(){if(!_guard){_guard=true;try{history.pushState({modal:1},"")}catch(e){}}}
window.addEventListener("popstate",function(){
  if(_skipPop){_skipPop=false;return}
  _guard=false;_fromPop=true;
  try{
    if(overlaysOpen()){
      if($("#nav-scrim").classList.contains("on"))closeNav();
      else if($("#confirm-scrim").classList.contains("on"))closeConfirm();
      else if($("#form-scrim").classList.contains("on")){if(formDirty)warnDirty();else closeForm();}
      else if($("#detail-scrim").classList.contains("on"))closeDetail();
      if(overlaysOpen())guardPush();
    }
  }finally{_fromPop=false}
});
document.addEventListener("keydown",function(e){if(e.key!=="Escape"||!overlaysOpen())return;
  if($("#nav-scrim").classList.contains("on"))closeNav();else if($("#confirm-scrim").classList.contains("on"))closeConfirm();
  else if($("#form-scrim").classList.contains("on")){if(formDirty)warnDirty();else closeForm()}else if($("#detail-scrim").classList.contains("on"))closeDetail()});

/* ===== 지도 ===== */
var map,markers=[],meMarker,meCircle;
function initMap(){
  if(typeof L==="undefined"){$("#map").innerHTML='<div class="empty">지도를 불러오지 못했어요. 인터넷 연결 후 새로고침 해주세요.</div>';return}
  map=L.map("map",{zoomControl:true}).setView([37.55,126.99],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
  drawMarkers();fitAll();
}
function pinIcon(s){return L.divIcon({className:"",html:'<div class="pin" style="background:'+sColor(s)+'"></div>',iconSize:[28,28],iconAnchor:[14,26]})}
function drawMarkers(){
  markers.forEach(function(m){map.removeLayer(m)});markers=[];
  customers.forEach(function(g){if(g.lat&&g.lng){var m=L.marker([g.lat,g.lng],{icon:pinIcon(g.status)}).addTo(map);m.on("click",function(){openDetail(g.id)});m.bindTooltip(g.name+" · "+g.status,{direction:"top",offset:[0,-24]});markers.push(m)}});
}
function fitAll(){if(!map)return;var pts=customers.filter(function(c){return c.lat}).map(function(c){return[c.lat,c.lng]});if(pts.length)map.fitBounds(pts,{padding:[40,40]});customers.forEach(function(c){delete c._dist});renderList()}
function setMe(la,ln){if(meMarker)map.removeLayer(meMarker);meMarker=L.marker([la,ln],{icon:L.divIcon({className:"",html:'<div class="pin" style="background:#4a54e1"></div>',iconSize:[28,28],iconAnchor:[14,26]})}).addTo(map).bindTooltip("내 위치",{permanent:true,direction:"top",offset:[0,-24]})}
function myLocation(){
  if(!map){toast("지도를 불러오는 중이에요");return}
  if(!navigator.geolocation){toast("위치 기능을 지원하지 않아요");return}
  toast("현재 위치 확인 중…");
  navigator.geolocation.getCurrentPosition(function(p){setMe(p.coords.latitude,p.coords.longitude);map.setView([p.coords.latitude,p.coords.longitude],14);toast("현재 위치 표시")},
    function(){toast("위치 권한을 허용해주세요")},{enableHighAccuracy:true,timeout:8000});
}
function showNear(){
  if(!map){toast("지도를 불러오는 중이에요");return}
  if(!navigator.geolocation){toast("위치 기능을 지원하지 않아요");return}
  toast("현재 위치 확인 중…");
  navigator.geolocation.getCurrentPosition(function(p){placeMe(p.coords.latitude,p.coords.longitude)},
    function(){toast("위치 권한이 없어 지도 중심 기준으로 표시합니다");var c=map.getCenter();placeMe(c.lat,c.lng)},{enableHighAccuracy:true,timeout:8000});
}
function placeMe(la,ln){
  setMe(la,ln);if(meCircle)map.removeLayer(meCircle);
  meCircle=L.circle([la,ln],{radius:3000,color:"#4a54e1",weight:1,fillColor:"#4a54e1",fillOpacity:.08}).addTo(map);
  customers.forEach(function(c){c._dist=c.lat?haversine(la,ln,c.lat,c.lng):null});
  map.setView([la,ln],13);
  var near=customers.filter(function(c){return c._dist!=null&&c._dist<=3});
  toast(near.length?"반경 3km 내 고객 "+near.length+"명":"반경 3km 내 고객이 없어요");renderList();
}
function haversine(la1,ln1,la2,ln2){var R=6371,rad=function(x){return x*Math.PI/180};var dLa=rad(la2-la1),dLn=rad(ln2-ln1);var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(rad(la1))*Math.cos(rad(la2))*Math.sin(dLn/2)*Math.sin(dLn/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

/* ===== 주소 검색 (Daum) ===== */
function openPostcode(which){
  if(typeof daum==="undefined"||!daum.Postcode){toast("주소 검색을 불러오지 못했어요");return}
  new daum.Postcode({oncomplete:function(data){
    var a=data.roadAddress||data.jibunAddress;
    var el=(which==="work")?$("#f-workaddr"):$("#f-addr");
    el.value=a+" ";
    try{el.focus();el.setSelectionRange(el.value.length,el.value.length);}catch(e){}
  }}).open();
}

/* ===== 티맵 길찾기 (자택/직장 선택) ===== */
function tmapGo(addr,lat,lng){
  if(!addr){toast("주소가 없어요");return}
  var href=(lat&&lng)?("tmap://route?goalname="+encodeURIComponent(addr)+"&goalx="+lng+"&goaly="+lat):("tmap://search?name="+encodeURIComponent(addr));
  var left=false,onHide=function(){if(document.visibilityState==="hidden")left=true};
  document.addEventListener("visibilitychange",onHide);
  location.href=href;
  setTimeout(function(){document.removeEventListener("visibilitychange",onHide);if(left)return;   // 티맵이 안 열렸으면 카카오맵(웹)으로
    toast("티맵이 없어서 카카오맵으로 열어요");
    location.href=(lat&&lng)?("https://map.kakao.com/link/to/"+encodeURIComponent(addr)+","+lat+","+lng):("https://map.kakao.com/link/search/"+encodeURIComponent(addr));},1600);
}
function navChoose(id){
  var g=findPerson(id);if(!g)return;
  var home=g.addr,work=g.workAddr;
  if(home&&work){$("#nav-name").textContent=g.name+" 님";$("#nav-home").textContent=home;$("#nav-work").textContent=work+(g.company?" · "+g.company:"");navTarget=g;openSheet("#nav-scrim");}
  else if(home)tmapGo(home,g.lat,g.lng);
  else if(work)tmapGo(work,g.workLat,g.workLng);
  else toast("등록된 주소가 없어요");
}
var navTarget=null;
function navPick(kind){
  var g=navTarget;closeNav();
  if(!g)return;
  if(kind==="work")tmapGo(g.workAddr,g.workLat,g.workLng);
  else tmapGo(g.addr,g.lat,g.lng);
}
/* ===== 카카오톡 (고객 대화방 선택 후 인사말 전송) =====
   ※ 카카오는 '전화번호로 특정 대화방 바로 열기'를 허용하지 않아,
     공유창 → 카카오톡 → 고객 대화방 선택 방식으로 연결합니다. */
function kakaoBtn(g,stop){
  var ic='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.5 2 10.8c0 2.8 1.9 5.2 4.7 6.6-.2.7-.7 2.6-.8 3-.1.5.2.5.4.4.2-.1 2.6-1.8 3.6-2.5.7.1 1.4.2 2.1.2 5.5 0 10-3.5 10-7.7S17.5 3 12 3z"/></svg>';
  return '<button type="button" class="act kakao" onclick="'+(stop?"event.stopPropagation();":"")+'kakaoTalk('+g.id+')">'+ic+'카톡</button>';
}
function copyText(t){
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t);return true}}catch(e){}
  try{var ta=document.createElement("textarea");ta.setAttribute("readonly","");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);return true}catch(e){return false}
}
function kakaoTalk(id){
  var g=findPerson(id);if(!g)return;armContact(id);
  copyText(g.name);   // 고객 이름을 미리 복사 → 카톡 검색창에 '붙여넣기'만 하면 됨
  var me=(ME&&ME.name)?(ME.name+(ME.role?" "+ME.role:"")):"";
  var msg=g.name+"님, 안녕하세요"+(me?". "+me+"입니다":"")+" 😊";
  if(navigator.share){
    toast("'"+g.name+"' 이름 복사됨 · 카톡 검색창을 길게 눌러 붙여넣기");
    navigator.share({text:msg}).catch(function(){});
    return;
  }
  toast("'"+g.name+"' 이름 복사됨 · 카톡 검색창에 붙여넣기 하세요");
  setTimeout(function(){location.href=/iPhone|iPad|iPod/i.test(navigator.userAgent)?"kakaotalk://":"kakaotalk://launch";},500);
}
function navBtn(g,stop){
  var ic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>';
  return '<button type="button" class="act route" onclick="'+(stop?"event.stopPropagation();":"")+'navChoose('+g.id+')">'+ic+'길찾기</button>';
}

/* ===== 폼 ===== */
var formMode="new",formPerson=null;
function showGroups(person,contract){$("#grp-person").style.display=person?"block":"none";$("#grp-contract").style.display=contract?"block":"none"}
function setContractEditOnly(editOnly){var s=$("#fld-status");if(s)s.style.display=editOnly?"none":"block"}
function clearPersonFields(){$("#f-workaddr").value="";$("#f-company").value="";$("#f-position").value="";$("#f-memo").value="";}
function openNewForm(){formDirty=false;
  formMode="new";formPerson=null;
  $("#form-title").textContent="신규 고객 추가";$("#f-row").value="";
  $("#f-name").value="";$("#f-phone").value="";$("#f-birth").value="";$("#f-renew").value="";
  $("#f-lastcontact").value=todayStr();
  $("#f-addr").value="";clearPersonFields();setFamily("");
  $("#f-product").value="";$("#f-fee").value="";$("#f-status").value="신규가망";
  setContractEditOnly(false);showGroups(true,true);$("#del-btn").style.display="none";openSheet("#form-scrim");
}
function openPersonForm(person){formDirty=false;
  formMode="person";formPerson=person;
  $("#form-title").textContent="고객 정보 수정";$("#f-row").value="";
  $("#f-name").value=person.name||"";$("#f-phone").value=person.phone||"";
  $("#f-birth").value=person.birth?String(person.birth).slice(0,10):"";syncSangryeong();
  $("#f-lastcontact").value=person.last?String(person.last).slice(0,10):"";
  $("#f-addr").value=person.addr||"";
  $("#f-workaddr").value=person.workAddr||"";
  $("#f-company").value=person.company||"";$("#f-position").value=person.position||"";
  $("#f-memo").value=person.memo||"";
  setFamily(person.family||"");
  showGroups(true,false);$("#del-btn").style.display="none";openSheet("#form-scrim");
}
function openContractForm(person,contract){formDirty=false;
  formMode=contract?"contract-edit":"contract-add";formPerson=person;
  $("#form-title").textContent=contract?("계약 수정 · "+person.name):(person.name+" · 계약 추가");
  $("#f-row").value=contract?contract._row:"";
  $("#f-product").value=contract?contract.product:"";$("#f-fee").value=contract?fmtFee(contract.fee):"";
  $("#f-status").value=person?manualStatus(person):"신규가망";
  setContractEditOnly(!!contract);
  showGroups(false,true);$("#del-btn").style.display=(contract&&contract._row)?"block":"none";openSheet("#form-scrim");
}
function fmtFee(v){var d=String(v==null?"":v).replace(/[^0-9]/g,"");return d?Number(d).toLocaleString("ko-KR"):""}
function syncSangryeong(){var b=$("#f-birth").value;$("#f-renew").value=b?clientSangryeong(b):""}
function addFamRow(rel,name){
  var w=document.createElement("div");w.className="fam-row";
  w.innerHTML='<input class="fam-rel" placeholder="관계(예: 배우자)" aria-label="가족 관계"><input class="fam-name" placeholder="이름" aria-label="가족 이름"><button type="button" class="fam-del" onclick="this.parentNode.remove();formDirty=true" aria-label="이 가족 지우기">✕</button>';
  w.querySelector(".fam-rel").value=rel||"";w.querySelector(".fam-name").value=name||"";
  $("#fam-list").appendChild(w);
}
function setFamily(str){
  $("#fam-list").innerHTML="";
  var parts=String(str||"").split(",").map(function(s){return s.trim()}).filter(Boolean);
  if(!parts.length){addFamRow();return}
  parts.forEach(function(p){var sp=p.split(/\s+/);var rel=sp.shift()||"";addFamRow(rel,sp.join(" "))});
}
function getFamily(){
  var out=[];$("#fam-list").querySelectorAll(".fam-row").forEach(function(r){
    var rel=r.querySelector(".fam-rel").value.trim(),nm=r.querySelector(".fam-name").value.trim();
    if(rel||nm)out.push((rel+" "+nm).trim());
  });return out.join(", ");
}
function editContract(row){var f=findByRow(row);if(!f)return;closeDetail();openContractForm(f.person,f.contract)}
function addContract(id){var g=findPerson(id);if(!g)return;closeDetail();openContractForm(g,null)}
function editPerson(id){var g=findPerson(id);if(!g)return;closeDetail();openPersonForm(g)}
function saveForm(){
  if(formMode==="person"){
    var pn=$("#f-name").value.trim();if(!pn){toast("이름을 적어 주세요");$("#f-name").focus();return}
    var paddr=$("#f-addr").value.trim();
    var pwork=$("#f-workaddr").value.trim();
    var p={"이름":pn,"연락처":$("#f-phone").value.trim(),"생년월일":$("#f-birth").value.trim(),"주소":paddr,"가족관계":getFamily(),"상령일":$("#f-renew").value,"최근접촉일":$("#f-lastcontact").value,
      "직장주소":pwork,"상호명":$("#f-company").value.trim(),"직급":$("#f-position").value.trim(),"메모":$("#f-memo").value};
    showLoader(true);
    server("apiUpdatePerson",getToken(),formPerson.name,p).then(function(res){
      if(res&&res.ok){closeForm();toast("고객 정보를 수정했어요");loadCustomers()}else{showLoader(false);toast("수정 실패"+(res&&res.msg?": "+res.msg:"")+" · 다시 시도해 주세요")}
    }).catch(function(e){showLoader(false);toast("저장 오류: "+e.message+" · 다시 시도해 주세요")});
    return;
  }
  var obj,row=$("#f-row").value;
  if(formMode==="new"){
    var name=$("#f-name").value.trim(),phone=$("#f-phone").value.trim();
    if(!name){toast("이름을 적어 주세요");$("#f-name").focus();return}
    if(String(phone).replace(/[^0-9]/g,"").length<9){toast("연락처를 끝까지 적어 주세요 (예: 010-1234-5678)");$("#f-phone").focus();return}
    var addr=$("#f-addr").value.trim();
    var nwork=$("#f-workaddr").value.trim();
    obj={"이름":name,"연락처":phone,"생년월일":$("#f-birth").value.trim(),"주소":addr,"가족관계":getFamily(),"상령일":$("#f-renew").value,
      "직장주소":nwork,"상호명":$("#f-company").value.trim(),"직급":$("#f-position").value.trim(),"메모":$("#f-memo").value};
  }else{
    var g=formPerson;
    obj={"이름":g.name,"연락처":g.phone||"","생년월일":g.birth||"","주소":g.addr||"","가족관계":g.family||"","상령일":g.renew||"","최근접촉일":g.last||"",
      "직장주소":g.workAddr||"","상호명":g.company||"","직급":g.position||"","메모":g.memo||"",
      "위도":g.lat||"","경도":g.lng||"","직장위도":g.workLat||"","직장경도":g.workLng||""};
  }
  obj["가입상품"]=$("#f-product").value.trim();obj["월보험료"]=$("#f-fee").value.replace(/[^0-9]/g,"");obj["상태"]=$("#f-status").value;
  if(row){obj._row=+row;}else if(formMode==="new"){obj["최근접촉일"]=($("#f-lastcontact").value||todayStr());}
  showLoader(true);
  server("apiSaveCustomer",getToken(),obj).then(function(res){
    if(res&&res.ok){closeForm();toast(row?"수정했어요":"저장했어요");loadCustomers()}else{showLoader(false);toast("저장 실패"+(res&&res.msg?": "+res.msg:"")+" · 다시 시도해 주세요")}
  }).catch(function(e){showLoader(false);toast("저장 오류: "+e.message+" · 다시 시도해 주세요")});
}
function delCustomer(){var row=+$("#f-row").value;if(!row)return;var f=findByRow(row);showConfirm("이 계약을 삭제할까요?","<b>"+esc(f&&f.contract.product||"이 계약")+"</b>"+(row>0?"<br>헤리티지 프로에서 온 계약은 다음 청약 저장 때 다시 나타날 수 있어요.":""),function(){showLoader(true);server("apiDeleteCustomer",getToken(),row).then(function(res){if(res&&res.ok){closeForm();toast("삭제했어요");loadCustomers()}else{showLoader(false);toast("삭제 실패"+(res&&res.msg?": "+res.msg:""))}}).catch(function(e){showLoader(false);toast("삭제 오류: "+e.message)})})}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}

/* ===== 연락 기록: 전화·문자·카톡 후 돌아오면 '오늘 연락함' 제안 ===== */
var _armed=null;
function armContact(id){_armed={id:id,t:Date.now()}}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible"||!_armed)return;
  var a=_armed;_armed=null;if(Date.now()-a.t<2500)return;
  var g=findPerson(a.id);if(!g||(g.last&&daysTo(g.last)===0))return;
  $("#toast").classList.remove("on");$("#cbar-text").textContent=g.name+" 님과 연락했나요?";$("#cbar").dataset.id=g.id;$("#cbar").classList.add("on");
  clearTimeout(window._cbarT);window._cbarT=setTimeout(function(){$("#cbar").classList.remove("on")},15000);
});
function markContacted(id){
  var g=findPerson(id);if(!g)return;var today=todayStr();
  $("#cbar").classList.remove("on");
  var btn=$("#touch-btn");if(btn)btn.disabled=true;
  server("apiUpdatePerson",getToken(),g.name,{"이름":g.name,"최근접촉일":today}).then(function(res){
    if(btn)btn.disabled=false;
    if(!res||!res.ok){toast("기록하지 못했어요"+(res&&res.msg?": "+res.msg:"")+" · 다시 눌러 주세요");return}
    g.last=today;g.contracts.forEach(function(c){c.last=today});g.status=deriveStatus(g);renderAll();
    if($("#detail-scrim").classList.contains("on")&&btn){btn.classList.add("done");btn.innerHTML='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>오늘 연락 기록됨'}
    toast(g.name+" 님 오늘 연락을 기록했어요");
  }).catch(function(e){if(btn)btn.disabled=false;toast("기록 오류: "+e.message)});
}
function setFilter(f){filter=f;document.querySelectorAll(".chip").forEach(function(x){var on=x.dataset.f===f;x.classList.toggle("on",on);x.setAttribute("aria-pressed",String(on))});renderList()}

function go(v){
  if(v==="add"){openNewForm();return}
  document.querySelectorAll(".view").forEach(function(x){x.classList.remove("active")});
  document.querySelectorAll(".nav button").forEach(function(b){var on=b.dataset.v===v;b.classList.toggle("on",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  window.scrollTo(0,0);
  $("#v-"+v).classList.add("active");
  if(v==="map"){setTimeout(function(){if(!map)initMap();else map.invalidateSize()},80)}
}

function heritageLoader(on){var el=$("#hloader");if(!el)return;if(on){el.classList.remove("out");el.classList.add("on")}else{el.classList.add("out");setTimeout(function(){el.classList.remove("on","out")},500)}}
function doLogin(){
  var name=$("#in-name").value.trim(),jumin=$("#in-jumin").value.trim();
  if(!name||!jumin){$("#login-err").textContent="성명과 주민번호 뒷자리를 입력하세요.";return}
  $("#login-btn").disabled=true;$("#login-err").textContent="";heritageLoader(true);
  server("apiLogin",name,jumin).then(function(res){$("#login-btn").disabled=false;if(res.ok){setToken(res.token);enterApp(res.user)}else{heritageLoader(false);$("#login-err").textContent=res.msg||"로그인 실패"}}).catch(function(e){heritageLoader(false);$("#login-btn").disabled=false;$("#login-err").textContent="서버 오류: "+e.message});
}
function fmtDate(){var d=new Date();var w=["일","월","화","수","목","금","토"][d.getDay()];return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+w+")"}
function bizDaysLeft(){var d=new Date();var y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate();var n=0;for(var day=d.getDate();day<=last;day++){var wd=new Date(y,m,day).getDay();if(wd!==0&&wd!==6)n++;}return n}
function enterApp(user){ME=user;heritageLoader(true);$("#login").classList.add("hide");$("#app").classList.add("on");$("#nav").style.display="flex";$("#me-name").textContent=user.name;$("#me-role").textContent=(user.role||"");var _bd=bizDaysLeft();$("#hi-name").textContent="이번 달 영업일이 "+_bd+"일 남았어요";$("#hi-date").textContent=fmtDate();
  var p=loadCustomers();(p&&p.then?p:Promise.resolve()).then(function(){loadOverdue();setTimeout(function(){heritageLoader(false)},250)}).catch(function(){heritageLoader(false)});}
function doLogout(){server("apiLogout",getToken()).catch(function(){});clearToken();customers=[];overdue=null;renderOverdueCard();$("#app").classList.remove("on");$("#nav").style.display="none";$("#login").classList.remove("hide");$("#in-jumin").value=""}

$("#in-jumin").addEventListener("input",function(){this.value=this.value.replace(/[^0-9]/g,"").slice(0,7)});
$("#logout-btn").addEventListener("click",function(){showConfirm("로그아웃할까요?","다시 들어올 때 성명과 주민번호 뒷자리를 입력해야 해요.",doLogout,"로그아웃","brand")});
document.querySelectorAll(".nav button").forEach(function(b){b.addEventListener("click",function(){go(b.dataset.v)})});
$("#search").addEventListener("input",function(e){query=e.target.value;renderList()});
$("#chips").addEventListener("click",function(e){var c=e.target.closest(".chip");if(!c)return;setFilter(c.dataset.f)});
document.querySelectorAll(".qf").forEach(function(b){b.addEventListener("click",function(){setFilter(b.dataset.f);query="";$("#search").value="";go("list")})});
$("#cbar-yes").addEventListener("click",function(){markContacted(+$("#cbar").dataset.id)});
$("#cbar-no").addEventListener("click",function(){$("#cbar").classList.remove("on")});
$("#f-fee").addEventListener("input",function(){this.value=fmtFee(this.value)});
$("#near-btn").addEventListener("click",showNear);
$("#all-btn").addEventListener("click",fitAll);
$("#loc-btn").addEventListener("click",myLocation);
$("#f-birth").addEventListener("change",syncSangryeong);
$("#f-phone").addEventListener("input",function(){var d=this.value.replace(/[^0-9]/g,"").slice(0,11),v=d;if(d.length>=4&&d.length<8)v=d.slice(0,3)+"-"+d.slice(3);else if(d.length>=8)v=d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);this.value=v;});
$("#save-btn").addEventListener("click",saveForm);
$("#del-btn").addEventListener("click",delCustomer);
$("#confirm-no").addEventListener("click",closeConfirm);
$("#confirm-yes").addEventListener("click",function(){var cb=_confirmCb;closeConfirm();if(cb)cb()});
$("#confirm-scrim").addEventListener("click",function(e){if(e.target===this)closeConfirm()});
$("#nav-scrim").addEventListener("click",function(e){if(e.target===this)closeNav()});
document.querySelectorAll(".scrim").forEach(function(s){s.addEventListener("click",function(e){if(e.target!==s)return;if(s.id==="form-scrim"){if(formDirty){warnDirty();return}closeForm();return}if(s.id==="detail-scrim"){closeDetail();return}s.classList.remove("on");afterClose()})});
$("#form-scrim").addEventListener("input",function(){formDirty=true});$("#form-scrim").addEventListener("change",function(){formDirty=true});

(function(){var t=getToken();if(!t){return}heritageLoader(true);server("apiMe",t).then(function(res){if(res.ok)enterApp(res.user);else heritageLoader(false)}).catch(function(){heritageLoader(false)})})();
</script>
